                              border:`1px solid ${t.subcategory===sub ? row.expanded.color : C.border}`,
                              background: t.subcategory===sub ? row.expanded.color+"22" : "transparent",
                              color: t.subcategory===sub ? row.expanded.color : C.muted,
                              fontWeight: t.subcategory===sub ? 600 : 400,
                            }}>{sub}</button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ));
              })()}
            </div>
          </div>

          <button onClick={onToggleEdit} style={{ ...btnStyle(C.accent), width:"100%", padding:"6px", marginTop:8, fontSize:11 }}>Gotowe</button>
        </div>
      )}
    </div>
  );
}

function MiniBar({ category, amount, max, categories }) {
  const cat = (categories||DEFAULT_CATEGORIES).find(c => c.label === category) || DEFAULT_CATEGORIES.slice(-1)[0];
  const pct = Math.min((amount/max)*100, 100);
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4 }}>
        <span>{cat.icon} {category}</span>
        <span style={{ color: C.muted }}>{fmt(amount)}</span>
      </div>
      <div style={{ background: C.border, borderRadius: 4, height: 6 }}>
        <div style={{ width:`${pct}%`, height:6, borderRadius:4, background: cat.color, transition:"width .4s" }} />
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function BudzetDomowy({ sessionPin, importedData }) {
  // ── Load from localStorage on first render, but prefer freshly-decrypted embedded data if present
  const saved = importedData || loadState();

  // Migrate older saved category data forward: add any missing fields (e.g. "subcategories")
  // to existing categories, and append any default categories the user doesn't have yet
  // (e.g. "Oszczędności" added in a later version) — without touching the user's own
  // customizations (colors, icons, extra categories they created, existing subcategories).
  function migrateCategories(savedCats) {
    if (!savedCats || savedCats.length === 0) return DEFAULT_CATEGORIES;
    const byLabel = {};
    savedCats.forEach(c => { byLabel[c.label] = { subcategories: [], ...c }; });
    // Add any default categories missing from the saved set (inserted before "Inne" if present)
    const missing = DEFAULT_CATEGORIES.filter(dc => !byLabel[dc.label]);
    if (missing.length === 0) return savedCats.map(c => ({ subcategories: [], ...c }));
    const result = savedCats.map(c => ({ subcategories: [], ...c }));
    const inneIdx = result.findIndex(c => c.label === "Inne");
    if (inneIdx === -1) result.push(...missing);
    else result.splice(inneIdx, 0, ...missing);
    return result;
  }

  const [tab, setTab]               = useState("dashboard");
  const [transactions, setTransactions] = useState(migrateTransactionEncoding(saved?.transactions) ?? DEMO_TRANSACTIONS);
  const [categories, setCategories]     = useState(migrateCategories(saved?.categories));
  const [categoryRules, setCategoryRules] = useState(saved?.categoryRules ?? {});
  const [subcategoryRules, setSubcategoryRules] = useState(saved?.subcategoryRules ?? {});
  const [ownerRules, setOwnerRules] = useState(saved?.ownerRules ?? {});
  const [savings, setSavings]           = useState(saved?.savings        ?? 12500);
  const [investments, setInvestments]   = useState(saved?.investments    ?? 28000);
  const [investmentReturn, setInvestmentReturn] = useState(saved?.investmentReturn ?? 7.2);
  // Savings/investment accounts: each can be linked to one or more category/subcategory pairs.
  // balance = manually-set or last-synced amount; includedTxIds = transactions already folded
  // into that balance, so re-syncing only adds NEW matching transactions, never double-counts.
  const [accounts, setAccounts] = useState(saved?.accounts ?? []);
  const [plannedExpenses, setPlannedExpenses] = useState(saved?.plannedExpenses ?? []);
  const [owners, setOwners] = useState(saved?.owners ?? ["Ty", "Małżonek/Małżonka"]);

  // UI-only state (not persisted)
  const [drilldown, setDrilldown] = useState(null); // null | "income" | "expenses" | "savings"
  const [expandedDrillCat, setExpandedDrillCat] = useState(null); // category label expanded within drilldown
  const [expandedSavingsDesc, setExpandedSavingsDesc] = useState(null); // savings description expanded
  const [editingDrillTxId, setEditingDrillTxId] = useState(null); // transaction whose category/subcategory picker is open within a dashboard drilldown
  const [drillOnlyThisTx, setDrillOnlyThisTx] = useState(null); // null | true | false — mandatory scope choice, same pattern as the History tab
  const [expandedDrillPickerCategory, setExpandedDrillPickerCategory] = useState(null); // category label whose subcategories are shown inline within the drilldown picker
  const [expandedAccountId, setExpandedAccountId] = useState(null); // account whose included transactions are shown
  const [editingAccountTxId, setEditingAccountTxId] = useState(null); // transaction whose category picker is open within an account view
  const [filterPeriod, setFilterPeriod] = useState("all"); // "all" | "YYYY-MM"
  const [ownerFilter, setOwnerFilter] = useState("all"); // "all" | owner name
  const [statementText, setStatementText] = useState("");
  const [parsing, setParsing]     = useState(false);
  const [parseMsg, setParseMsg]   = useState("");
  const [pendingImport, setPendingImport] = useState(null); // { newTx: [...], duplicates: [{ incoming, existing }] }
  const [duplicateChoices, setDuplicateChoices] = useState({}); // index -> boolean (true = import anyway)
  const [form, setForm]           = useState({ date:"", description:"", amount:"", category:"Inne", type:"expense", subcategory:"", owner:"" });
  const [advice, setAdvice]       = useState("");
  const [loadingAdvice, setLoadingAdvice] = useState(false);
  const [newCatForm, setNewCatForm] = useState(() => ({
    label:"", icon:"📦",
    color: pickDistinctColor(DEFAULT_CATEGORIES.map(c => c.color)),
  }));
  const [showNewCat, setShowNewCat] = useState(false);
  const [editingOwnerIdx, setEditingOwnerIdx] = useState(null);
  const [ownerNameInput, setOwnerNameInput] = useState("");
  const [editingCategoryId, setEditingCategoryId] = useState(null);
  const [onlyThisTransaction, setOnlyThisTransaction] = useState(null); // null = not chosen yet; must pick true/false before editing
  const [expandedPickerCategory, setExpandedPickerCategory] = useState(null); // category label whose subcategories are shown inline within the transaction-edit picker
  const [expandedTxId, setExpandedTxId] = useState(null);
  const [txSearch, setTxSearch] = useState("");
  const [txCategoryFilter, setTxCategoryFilter] = useState("all"); // "all" | category label
  const [autoApplyMsg, setAutoApplyMsg] = useState(null);
  const [plannedForm, setPlannedForm] = useState({
    label:"", amount:"", category:"Inne", day:"1", comment:"", noDueDate:false,
    mode:"all", // "all" | "range" | "specific"
    rangeStart:"", rangeEnd:"",
    specificMonths:[],
  });
  const [editingPlannedId, setEditingPlannedId] = useState(null);
  const [showNewAccount, setShowNewAccount] = useState(false);
  const [editingAccountId, setEditingAccountId] = useState(null);
  const [accountForm, setAccountForm] = useState({
    name:"", type:"savings", balance:"", linkedCategories:[],
  });
  const [pendingDeleteAccount, setPendingDeleteAccount] = useState(null);
  const [expandedLinkCategory, setExpandedLinkCategory] = useState(null); // category label whose subcategories are shown in the account form
  const [addingTxForAccount, setAddingTxForAccount] = useState(null); // account id currently showing the manual-add-transaction form
  const [accountTxForm, setAccountTxForm] = useState({ date:"", description:"", amount:"" });
  const [showAccountChart, setShowAccountChart] = useState({}); // { [accountId]: boolean }
  const [accountTxVisibleCount, setAccountTxVisibleCount] = useState({}); // { [accountId]: number } — how many included transactions to render before "show more"
  const [accountTxSearch, setAccountTxSearch] = useState({}); // { [accountId]: string } — search filter within an account's transaction list
  const ACCOUNT_TX_PAGE_SIZE = 10;

  // ── Cloud sync (Firebase) — declared here, BEFORE the save effect below, since that effect
  // reads cloudSyncEnabled. Declaring it after led to a "Cannot access before initialization"
  // crash on every render, which is why the toggle appeared completely unresponsive.
  const [cloudSyncEnabled, setCloudSyncEnabled] = useState(saved?.cloudSyncEnabled ?? false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState("idle"); // "idle" | "syncing" | "synced" | "error" | "no-pin"
  const [cloudSyncError, setCloudSyncError] = useState("");
  const [cloudLastSyncedAt, setCloudLastSyncedAt] = useState(null);
  const cloudUnsubRef = useRef(null);
  const cloudLastPushedAtRef = useRef(0); // timestamp of our own last push, to ignore the echo from the live listener
  const cloudSyncTimerRef = useRef(null);
  const cloudSkipNextPushRef = useRef(false); // set true right after applying a remote update, so we don't immediately re-push it

  // ── Auto-save whenever persistent state changes
  const saveTimerRef = useRef(null);
  useEffect(() => {
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      const ok = saveState({ transactions, categories, categoryRules, subcategoryRules, ownerRules, savings, investments, investmentReturn, plannedExpenses, owners, accounts, cloudSyncEnabled });
      if (ok) { flashSave(); setStorageInfo(getStorageBreakdown()); }
    }, 600);
    return () => clearTimeout(saveTimerRef.current);
  }, [transactions, categories, categoryRules, subcategoryRules, ownerRules, savings, investments, investmentReturn, plannedExpenses, owners, accounts, cloudSyncEnabled]);

  // ── Cloud sync: push local changes up to Firestore (debounced, only while enabled + unlocked) ──
  useEffect(() => {
    if (!cloudSyncEnabled || !sessionPin) return;
    if (cloudSkipNextPushRef.current) { cloudSkipNextPushRef.current = false; return; }
    clearTimeout(cloudSyncTimerRef.current);
    cloudSyncTimerRef.current = setTimeout(async () => {
      setCloudSyncStatus("syncing");
      setCloudSyncError("");
      try {
        const payload = { transactions, categories, categoryRules, subcategoryRules, ownerRules, owners, savings, investments, investmentReturn, plannedExpenses, accounts };
        await syncPushToCloud(sessionPin, payload);
        cloudLastPushedAtRef.current = Date.now();
        setCloudLastSyncedAt(Date.now());
        setCloudSyncStatus("synced");
      } catch (err) {
        console.warn("Cloud push failed:", err);
        setCloudSyncStatus("error");
        setCloudSyncError(err.message || String(err));
      }
    }, 1500);
    return () => clearTimeout(cloudSyncTimerRef.current);
    // eslint-disable-next-line
  }, [cloudSyncEnabled, sessionPin, transactions, categories, categoryRules, subcategoryRules, ownerRules, savings, investments, investmentReturn, plannedExpenses, owners, accounts]);

  // ── Cloud sync: listen for changes pushed from OTHER devices, and apply them locally ──
  useEffect(() => {
    if (cloudUnsubRef.current) { cloudUnsubRef.current(); cloudUnsubRef.current = null; }
    if (!cloudSyncEnabled || !sessionPin) return;

    let cancelled = false;
    (async () => {
      try {
        await ensureFirebaseAuth();
        const docId = await deriveSyncDocId(sessionPin);
        if (cancelled) return;
        cloudUnsubRef.current = syncListenToCloud(
          sessionPin, docId,
          (remotePayload, updatedAtMillis) => {
            // Ignore the snapshot that's just an echo of our own most recent push
            if (Math.abs(updatedAtMillis - cloudLastPushedAtRef.current) < 2000) {
              setCloudSyncStatus("synced");
              setCloudLastSyncedAt(updatedAtMillis);
              return;
            }
            // A genuinely newer update arrived from another device — apply it locally
            cloudSkipNextPushRef.current = true; // don't immediately bounce this right back up
            if (remotePayload.transactions) setTransactions(remotePayload.transactions);
            if (remotePayload.categories) setCategories(remotePayload.categories);
            if (remotePayload.categoryRules) setCategoryRules(remotePayload.categoryRules);
            if (remotePayload.subcategoryRules) setSubcategoryRules(remotePayload.subcategoryRules);
            if (remotePayload.ownerRules) setOwnerRules(remotePayload.ownerRules);
            if (remotePayload.owners) setOwners(remotePayload.owners);
            if (remotePayload.savings !== undefined) setSavings(remotePayload.savings);
            if (remotePayload.investments !== undefined) setInvestments(remotePayload.investments);
            if (remotePayload.investmentReturn !== undefined) setInvestmentReturn(remotePayload.investmentReturn);
            if (remotePayload.plannedExpenses) setPlannedExpenses(remotePayload.plannedExpenses);
            if (remotePayload.accounts) setAccounts(remotePayload.accounts);
            setCloudLastSyncedAt(updatedAtMillis);
            setCloudSyncStatus("synced");
          },
          err => {
            console.warn("Cloud listen failed:", err);
            setCloudSyncStatus("error");
            setCloudSyncError(err.message || String(err));
          }
        );
      } catch (err) {
        if (!cancelled) {
          console.warn("Cloud listen setup failed:", err);
          setCloudSyncStatus("error");
          setCloudSyncError(err.message || String(err));
        }
      }
    })();

    return () => {
      cancelled = true;
      if (cloudUnsubRef.current) { cloudUnsubRef.current(); cloudUnsubRef.current = null; }
    };
  }, [cloudSyncEnabled, sessionPin]);

  // Toggle cloud sync on/off. Turning it on for the first time immediately pulls any existing
  // cloud data for this PIN (in case another device already has data waiting), merging it in
  // before the push effect above starts mirroring local state back up.
  const handleToggleCloudSync = async (enabled) => {
    if (enabled && !sessionPin) {
      setCloudSyncError("Synchronizacja w chmurze wymaga aktywnej sesji PIN — odblokuj aplikację ponownie.");
      setCloudSyncStatus("no-pin");
      return;
    }
    if (enabled) {
      setCloudSyncStatus("syncing");
      setCloudSyncError("");
      try {
        const existing = await syncPullFromCloud(sessionPin);
        if (existing && existing.payload) {
          cloudSkipNextPushRef.current = true;
          const p = existing.payload;
          if (p.transactions) setTransactions(p.transactions);
          if (p.categories) setCategories(p.categories);
          if (p.categoryRules) setCategoryRules(p.categoryRules);
          if (p.subcategoryRules) setSubcategoryRules(p.subcategoryRules);
          if (p.ownerRules) setOwnerRules(p.ownerRules);
          if (p.owners) setOwners(p.owners);
          if (p.savings !== undefined) setSavings(p.savings);
          if (p.investments !== undefined) setInvestments(p.investments);
          if (p.investmentReturn !== undefined) setInvestmentReturn(p.investmentReturn);
          if (p.plannedExpenses) setPlannedExpenses(p.plannedExpenses);
          if (p.accounts) setAccounts(p.accounts);
          cloudLastPushedAtRef.current = existing.updatedAt;
          setCloudLastSyncedAt(existing.updatedAt);
        }
        setCloudSyncStatus("synced");
        setCloudSyncEnabled(true);
      } catch (err) {
        console.warn("Cloud enable failed:", err);
        setCloudSyncStatus("error");
        setCloudSyncError(err.message || String(err));
      }
    } else {
      setCloudSyncEnabled(false);
      setCloudSyncStatus("idle");
      if (cloudUnsubRef.current) { cloudUnsubRef.current(); cloudUnsubRef.current = null; }
    }
  };

  // ── Helpers
  const catFor = (label) => categories.find(c => c.label === label) || categories[categories.length-1];

  // ── Filter helpers
  const today = new Date();
  const currentYear = today.getFullYear();

  // Build sorted list of months present in transactions
  const availableMonths = [...new Set(transactions.map(t => t.date.slice(0,7)))]
    .sort((a,b) => b.localeCompare(a));

  // YTD = all transactions from Jan 1 of current year to today
  const filteredTx = (filterPeriod === "all"
    ? transactions
    : filterPeriod === "ytd"
      ? transactions.filter(t => t.date.slice(0,4) === String(currentYear) && t.date <= today.toISOString().slice(0,10))
      : transactions.filter(t => t.date.slice(0,7) === filterPeriod)
  ).filter(t => ownerFilter === "all" || (t.owner || owners[0]) === ownerFilter);

  const income   = filteredTx.filter(t => t.amount > 0).reduce((s,t) => s+t.amount, 0);
  const expenses = filteredTx.filter(t => t.amount < 0).reduce((s,t) => s+Math.abs(t.amount), 0);
  const balance  = income - expenses;

  const catTotals = categories.map(c => ({
    ...c,
    total: filteredTx.filter(t => t.category===c.label && t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0),
  })).filter(c => c.total>0).sort((a,b)=>b.total-a.total);
  const maxCat = Math.max(...catTotals.map(c=>c.total), 1);

  // Drilldown breakdowns. Unlike catTotals above (used for the dashboard's category chart),
  // these keep the category currently being VIEWED (expanded) visible even if its total
  // temporarily drops to 0 mid-edit — e.g. the user opens "Wynagrodzenie", starts editing its
  // only transaction, and picks a new category. Without this, "Wynagrodzenie" would instantly
  // drop out of the list (total now 0) and take the whole open panel — including the "Gotowe"
  // button the user hasn't clicked yet — down with it. We only apply this exception while a
  // drilldown edit is actually in progress (editingDrillTxId is set), so categories with
  // genuinely zero transactions still don't show up the rest of the time.
  const incomeByCat = categories.map(c => ({
    ...c,
    total: filteredTx.filter(t => t.category===c.label && t.amount>0).reduce((s,t)=>s+t.amount,0),
  })).filter(c => c.total>0 || (editingDrillTxId !== null && c.label===expandedDrillCat)).sort((a,b)=>b.total-a.total);

  const expensesByCat = categories.map(c => ({
    ...c,
    total: filteredTx.filter(t => t.category===c.label && t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0),
  })).filter(c => c.total>0 || (editingDrillTxId !== null && c.label===expandedDrillCat)).sort((a,b)=>b.total-a.total);

  const savingsTxs = filteredTx.filter(t => (t.category==="Oszczędności" && t.amount<0) || t.id===editingDrillTxId);
  const savingsByDesc = Object.values(
    savingsTxs.reduce((acc,t) => {
      const key = t.description;
      if (!acc[key]) acc[key] = { description:key, total:0, count:0 };
      acc[key].total += Math.abs(t.amount);
      acc[key].count++;
      return acc;
    }, {})
  ).sort((a,b)=>b.total-a.total);

  // ── Handlers
  // Two transactions are considered the same if date, (rounded) amount and description all match
  function isDuplicateTx(a, b) {
    return a.date === b.date
      && Math.abs(a.amount - b.amount) < 0.005
      && a.description.trim().toLowerCase() === b.description.trim().toLowerCase();
  }

  const handleParseStatement = () => {
    if (!statementText.trim()) return;
    setParsing(true); setParseMsg("Parsowanie wyciągu…");
    try {
      const defaultOwner = ownerFilter === "all" ? owners[0] : ownerFilter;
      const parsed = parseStatement(statementText, categoryRules, subcategoryRules, ownerRules, defaultOwner);
      if (parsed.length === 0) { setParseMsg("Nie znaleziono transakcji. Sprawdź format CSV z mBanku."); setParsing(false); return; }

      const newTx = [];
      const duplicates = [];
      parsed.forEach(incoming => {
        const existing = transactions.find(t => isDuplicateTx(t, incoming));
        if (existing) duplicates.push({ incoming, existing });
        else newTx.push(incoming);
      });

      if (duplicates.length === 0) {
        // Nothing ambiguous — import everything right away
        const withIds = newTx.map((t,i) => ({ ...t, id: Date.now()+i }));
        setTransactions(prev => [...prev, ...withIds]);
        setParseMsg(`✓ Zaimportowano ${newTx.length} nowych transakcji!`);
        setStatementText("");
      } else {
        // Ask the user what to do with the ambiguous (likely duplicate) ones
        setPendingImport({ newTx, duplicates });
        setDuplicateChoices({}); // default: none selected = all duplicates skipped
        setParseMsg("");
      }
    } catch(e) { setParseMsg("Błąd: " + e.message); }
    setParsing(false);
  };

  const confirmImportWithDuplicates = () => {
    if (!pendingImport) return;
    const { newTx, duplicates } = pendingImport;
    const chosenDuplicates = duplicates
      .filter((_, i) => duplicateChoices[i])
      .map(d => d.incoming);
    const all = [...newTx, ...chosenDuplicates];
    const withIds = all.map((t,i) => ({ ...t, id: Date.now()+i }));
    setTransactions(prev => [...prev, ...withIds]);
    const skipped = duplicates.length - chosenDuplicates.length;
    setParseMsg(`✓ Zaimportowano ${all.length} transakcji` + (skipped>0 ? ` (pominięto ${skipped} duplikatów)` : "") + "!");
    setStatementText("");
    setPendingImport(null);
    setDuplicateChoices({});
  };

  const cancelImportDuplicatesModal = () => {
    setPendingImport(null);
    setDuplicateChoices({});
    setParseMsg("Import odrzucony.");
  };

  const handleAddManual = () => {
    if (!form.date || !form.description || !form.amount) return;
    const amt = parseFloat(form.amount) * (form.type==="expense" ? -1 : 1);
    const { subcategory, ...rest } = form;
    const owner = form.owner || (ownerFilter !== "all" ? ownerFilter : owners[0]);
    setTransactions(prev => [...prev, { ...rest, amount: amt, subcategory: subcategory || undefined, owner, id: Date.now() }]);
    setForm({ date:"", description:"", amount:"", category:"Inne", type:"expense", subcategory:"", owner:"" });
  };

  // ── Planned (recurring) expenses ──

  // Generate list of "YYYY-MM" between two months inclusive
  function monthsBetween(start, end) {
    if (!start || !end) return [];
    const [sy, sm] = start.split("-").map(Number);
    const [ey, em] = end.split("-").map(Number);
    const result = [];
    let y = sy, m = sm;
    let guard = 0;
    while ((y < ey || (y===ey && m<=em)) && guard < 600) {
      result.push(`${y}-${String(m).padStart(2,"0")}`);
      m++; if (m>12) { m=1; y++; }
      guard++;
    }
    return result;
  }

  // Build the resolved "months" array from the form's mode
  function resolveMonths(form) {
    if (form.mode === "all") return null; // null = applies every month indefinitely
    if (form.mode === "range") return monthsBetween(form.rangeStart, form.rangeEnd);
    return [...form.specificMonths].sort();
  }

  // Human-readable single month label, e.g. "2026-07" -> "lip 26"
  function monthLabel(m) {
    if (!m) return "";
    const [y, mo] = m.split("-");
    return new Date(y, mo-1).toLocaleDateString("pl-PL", { month:"short", year:"2-digit" });
  }

  // Human-readable summary of a months array: "Co miesiąc", a single range, or a comma list
  function monthsRangeLabel(months) {
    if (months === null || months === undefined) return "co miesiąc";
    if (months.length === 0) return "brak wybranych miesięcy";
    const sorted = [...months].sort();
    if (isContiguous(sorted) && sorted.length > 1) {
      return `${monthLabel(sorted[0])} – ${monthLabel(sorted[sorted.length-1])}`;
    }
    return sorted.map(monthLabel).join(", ");
  }

  // Generate a reasonable list of selectable months for the "specific months" picker:
  // 6 months back to 18 months forward from today
  function monthPickerOptions() {
    const result = [];
    const base = new Date(today.getFullYear(), today.getMonth()-6, 1);
    for (let i=0; i<25; i++) {
      const d = new Date(base.getFullYear(), base.getMonth()+i, 1);
      result.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
    }
    return result;
  }

  const handleAddPlanned = () => {
    if (!plannedForm.label.trim() || !plannedForm.amount) return;
    const day = plannedForm.noDueDate ? null : Math.min(31, Math.max(1, parseInt(plannedForm.day) || 1));
    const months = resolveMonths(plannedForm);
    const payload = {
      label: plannedForm.label.trim(),
      amount: parseFloat(plannedForm.amount),
      category: plannedForm.category,
      day, months,
      comment: plannedForm.comment.trim(),
    };
    if (editingPlannedId) {
      setPlannedExpenses(prev => prev.map(p => p.id===editingPlannedId ? { ...p, ...payload } : p));
      setEditingPlannedId(null);
    } else {
      setPlannedExpenses(prev => [...prev, { id: Date.now(), ...payload }]);
    }
    setPlannedForm({ label:"", amount:"", category:"Inne", day:"1", comment:"", noDueDate:false, mode:"all", rangeStart:"", rangeEnd:"", specificMonths:[] });
  };

  const handleEditPlanned = (p) => {
    setPlannedForm({
      label:p.label, amount:String(p.amount), category:p.category,
      day: p.day===null || p.day===undefined ? "1" : String(p.day),
      noDueDate: p.day===null || p.day===undefined,
      comment: p.comment || "",
      mode: p.months===null ? "all" : (p.months && p.months.length>0 && isContiguous(p.months) ? "range" : "specific"),
      rangeStart: p.months && p.months.length>0 ? p.months[0] : "",
      rangeEnd: p.months && p.months.length>0 ? p.months[p.months.length-1] : "",
      specificMonths: p.months || [],
    });
    setEditingPlannedId(p.id);
  };

  function isContiguous(months) {
    if (!months || months.length < 2) return true;
    const sorted = [...months].sort();
    for (let i=1; i<sorted.length; i++) {
      const [y1,m1] = sorted[i-1].split("-").map(Number);
      const [y2,m2] = sorted[i].split("-").map(Number);
      const expected = m1===12 ? `${y1+1}-01` : `${y1}-${String(m1+1).padStart(2,"0")}`;
      if (sorted[i] !== expected) return false;
    }
    return true;
  }

  const handleCancelEditPlanned = () => {
    setPlannedForm({ label:"", amount:"", category:"Inne", day:"1", comment:"", noDueDate:false, mode:"all", rangeStart:"", rangeEnd:"", specificMonths:[] });
    setEditingPlannedId(null);
  };

  const handleDeletePlanned = (id) => {
    setPlannedExpenses(prev => prev.filter(p => p.id !== id));
    if (editingPlannedId === id) handleCancelEditPlanned();
  };

  // Does a planned expense apply to a given "YYYY-MM"?
  function plannedAppliesToMonth(p, monthKey) {
    if (p.months === null || p.months === undefined) return true; // "every month"
    return p.months.includes(monthKey);
  }

  // Is a given planned expense marked as paid for a specific month?
  function isPlannedPaid(p, monthKey) {
    return (p.paidMonths || []).includes(monthKey);
  }

  // Toggle paid/unpaid status for a planned expense in a specific month
  const handleTogglePlannedPaid = (id, monthKey) => {
    setPlannedExpenses(prev => prev.map(p => {
      if (p.id !== id) return p;
      const paid = p.paidMonths || [];
      const next = paid.includes(monthKey) ? paid.filter(m => m !== monthKey) : [...paid, monthKey];
      return { ...p, paidMonths: next };
    }));
  };

  // Payment status for a planned expense in the context of a specific month:
  // "paid" (checked off), "overdue" (past due day, current month, unpaid), or "upcoming" (not yet due)
  function plannedPaymentStatus(p, monthKey) {
    if (isPlannedPaid(p, monthKey)) return "paid";
    if (p.day === null || p.day === undefined) return "upcoming"; // no due date set — never counts as overdue
    const todayStr = today.toISOString().slice(0,10);
    const dueDateStr = `${monthKey}-${String(p.day).padStart(2,"0")}`;
    return dueDateStr < todayStr ? "overdue" : "upcoming";
  }

  // ── Savings/Investment accounts ──────────────────────────────────────────────
  // Each account can be linked to multiple {category, subcategory} pairs. A transaction
  // "matches" an account if its category matches AND (no subcategory filter is set on the
  // link, OR the transaction's subcategory matches it too).
  function txMatchesAccountLink(tx, link) {
    if (tx.category !== link.category) return false;
    if (link.subcategory) return tx.subcategory === link.subcategory;
    return true; // link with no subcategory specified matches the whole category
  }
  function txMatchesAccount(tx, account) {
    return (account.linkedCategories || []).some(link => txMatchesAccountLink(tx, link));
  }

  // All transactions matching an account's links, that have NOT yet been folded into its balance
  function unsyncedTxForAccount(account) {
    const included = new Set(account.includedTxIds || []);
    return transactions.filter(t => !included.has(t.id) && txMatchesAccount(t, account));
  }

  // Net (signed) contribution of unsynced matching transactions to the account's balance.
  // Deposits (negative amount — money leaving checking into savings) ADD to the balance;
  // withdrawals (positive amount — money coming back out) SUBTRACT from it.
  function pendingSyncAmount(account) {
    return unsyncedTxForAccount(account).reduce(
      (s,t) => s + (t.amount < 0 ? Math.abs(t.amount) : -Math.abs(t.amount)), 0
    );
  }

  // All transactions already folded into an account's balance — i.e. the components that
  // make up its current sum, shown when the user expands the account to inspect it.
  function includedTxForAccount(account) {
    const included = new Set(account.includedTxIds || []);
    return transactions
      .filter(t => included.has(t.id))
      .sort((a,b) => b.date.localeCompare(a.date));
  }

  // (Account ↔ category reconciliation handlers moved below, after handleUpdateCategory/handleSetSubcategory are defined)

  const handleAddAccount = (accountData) => {
    setAccounts(prev => [...prev, {
      id: Date.now(),
      name: accountData.name,
      type: accountData.type, // "savings" | "investment"
      balance: parseFloat(accountData.balance) || 0,
      linkedCategories: accountData.linkedCategories || [],
      includedTxIds: [],
    }]);
  };

  const handleUpdateAccount = (id, updates) => {
    setAccounts(prev => prev.map(a => a.id===id ? { ...a, ...updates } : a));
  };

  const handleDeleteAccount = (id) => {
    setAccounts(prev => prev.filter(a => a.id !== id));
  };

  // Manually overwrite an account's balance (does not touch includedTxIds — the user is
  // explicitly correcting the number, e.g. to match their real bank balance).
  const handleSetAccountBalance = (id, newBalance) => {
    setAccounts(prev => prev.map(a => a.id===id ? { ...a, balance: parseFloat(newBalance) || 0 } : a));
  };

  // Fold all currently-unsynced matching transactions into the account's balance, and mark
  // them as included so they're never double-counted on a future sync. Deposits add to the
  // balance, withdrawals subtract from it.
  const handleSyncAccount = (id) => {
    setAccounts(prev => prev.map(a => {
      if (a.id !== id) return a;
      const unsynced = unsyncedTxForAccount(a);
      if (unsynced.length === 0) return a;
      const net = unsynced.reduce((s,t) => s + (t.amount < 0 ? Math.abs(t.amount) : -Math.abs(t.amount)), 0);
      return {
        ...a,
        balance: (a.balance || 0) + net,
        includedTxIds: [...(a.includedTxIds || []), ...unsynced.map(t => t.id)],
      };
    }));
  };

  const handleSyncAllAccounts = () => {
    setAccounts(prev => prev.map(a => {
      const unsynced = unsyncedTxForAccount(a);
      if (unsynced.length === 0) return a;
      const net = unsynced.reduce((s,t) => s + (t.amount < 0 ? Math.abs(t.amount) : -Math.abs(t.amount)), 0);
      return {
        ...a,
        balance: (a.balance || 0) + net,
        includedTxIds: [...(a.includedTxIds || []), ...unsynced.map(t => t.id)],
      };
    }));
  };

  const savingsAccounts = accounts.filter(a => a.type === "savings");
  const investmentAccounts = accounts.filter(a => a.type === "investment");
  const totalSavingsFromAccounts = savingsAccounts.reduce((s,a) => s + (a.balance||0), 0);
  const totalInvestmentsFromAccounts = investmentAccounts.reduce((s,a) => s + (a.balance||0), 0);
  // Combined totals shown on the dashboard: legacy single numbers + sum of all accounts,
  // so existing data isn't lost when the user starts adding accounts gradually.
  const combinedSavings = savings + totalSavingsFromAccounts;
  const combinedInvestments = investments + totalInvestmentsFromAccounts;

  // ── Account form handlers ──
  const resetAccountForm = () => setAccountForm({ name:"", type:"savings", balance:"", linkedCategories:[] });

  const openNewAccountForm = (type) => {
    resetAccountForm();
    setAccountForm(f => ({ ...f, type }));
    setEditingAccountId(null);
    setExpandedLinkCategory(null);
    setShowNewAccount(true);
  };

  const openEditAccountForm = (account) => {
    setAccountForm({
      name: account.name, type: account.type,
      balance: String(account.balance ?? 0),
      linkedCategories: account.linkedCategories || [],
    });
    setEditingAccountId(account.id);
    setExpandedLinkCategory(null);
    setShowNewAccount(true);
  };

  const cancelAccountForm = () => {
    setShowNewAccount(false);
    setEditingAccountId(null);
    setExpandedLinkCategory(null);
    resetAccountForm();
  };

  const handleSubmitAccountForm = () => {
    if (!accountForm.name.trim()) return;
    if (editingAccountId) {
      handleUpdateAccount(editingAccountId, {
        name: accountForm.name.trim(),
        type: accountForm.type,
        balance: parseFloat(accountForm.balance) || 0,
        linkedCategories: accountForm.linkedCategories,
      });
    } else {
      handleAddAccount({ ...accountForm, name: accountForm.name.trim() });
    }
    cancelAccountForm();
  };

  const toggleLinkedCategory = (category, subcategory) => {
    setAccountForm(f => {
      const exists = f.linkedCategories.some(l => l.category===category && l.subcategory===subcategory);
      const next = exists
        ? f.linkedCategories.filter(l => !(l.category===category && l.subcategory===subcategory))
        : [...f.linkedCategories, { category, subcategory: subcategory || undefined }];
      return { ...f, linkedCategories: next };
    });
  };

  const confirmDeleteAccountModal = () => {
    if (pendingDeleteAccount) handleDeleteAccount(pendingDeleteAccount);
    setPendingDeleteAccount(null);
  };

  // Open the manual-add-transaction mini-form for a given account, pre-filling today's date.
  const openAddTxForAccount = (accountId) => {
    setAccountTxForm({ date: today.toISOString().slice(0,10), description:"", amount:"" });
    setAddingTxForAccount(accountId);
  };
  const cancelAddTxForAccount = () => {
    setAddingTxForAccount(null);
    setAccountTxForm({ date:"", description:"", amount:"" });
  };

  // Create a real transaction for this account's primary linked category/subcategory, and
  // immediately fold it into the account's balance (no need to wait for a manual "sync" —
  // the user just typed it in specifically for this account, so it should count right away).
  const handleAddTxForAccount = (accountId) => {
    const account = accounts.find(a => a.id === accountId);
    if (!account || !accountTxForm.date || !accountTxForm.description.trim() || !accountTxForm.amount) return;
    const link = (account.linkedCategories || [])[0];
    const typedAmount = parseFloat(accountTxForm.amount);
    if (isNaN(typedAmount) || typedAmount === 0) return;
    const isWithdrawal = typedAmount < 0;
    const amountAbs = Math.abs(typedAmount);
    const newTx = {
      id: Date.now(),
      date: accountTxForm.date,
      description: accountTxForm.description.trim(),
      // Deposits follow the same convention as "Końcówki z zakupów" — recorded as an outgoing
      // entry (money leaving checking into savings). Withdrawals are the inverse: money coming
      // OUT of savings, so they're recorded as an incoming entry (positive amount), same as any
      // other income transaction.
      amount: isWithdrawal ? amountAbs : -amountAbs,
      category: link ? link.category : "Oszczędności",
      subcategory: link ? link.subcategory : undefined,
    };
    setTransactions(prev => [...prev, newTx]);
    setAccounts(prev => prev.map(a => a.id===accountId ? {
      ...a,
      // A withdrawal reduces the account's balance; a deposit increases it.
      balance: (a.balance||0) + (isWithdrawal ? -amountAbs : amountAbs),
      includedTxIds: [...(a.includedTxIds||[]), newTx.id],
    } : a));
    cancelAddTxForAccount();
  };

  // Delete a transaction that was manually added to a specific account: removes it from the
  // main transaction list, subtracts its value back out of the account's balance, and untracks
  // it from includedTxIds. Only ever offered for manually-added entries (no opType) — imported
  // bank transactions should be edited/recategorized instead of deleted from here.
  const [pendingDeleteAccountTx, setPendingDeleteAccountTx] = useState(null); // { accountId, txId }

  const confirmDeleteAccountTx = () => {
    if (!pendingDeleteAccountTx) return;
    const { accountId, txId } = pendingDeleteAccountTx;
    const tx = transactions.find(t => t.id === txId);
    if (tx) {
      // Reverse whatever effect this transaction had on the balance: removing a deposit
      // (negative amount) subtracts it back out; removing a withdrawal (positive amount) adds
      // it back in.
      const reversal = tx.amount < 0 ? -Math.abs(tx.amount) : Math.abs(tx.amount);
      setAccounts(prev => prev.map(a => a.id===accountId ? {
        ...a,
        balance: (a.balance||0) - reversal,
        includedTxIds: (a.includedTxIds||[]).filter(id => id !== txId),
      } : a));
      setTransactions(prev => prev.filter(t => t.id !== txId));
    }
    setPendingDeleteAccountTx(null);
  };

  // Build a cumulative balance-over-time series for an account's chart: starts at 0 and adds
  // each included transaction's contribution in chronological order (by transaction date).
  function accountBalanceHistory(account) {
    const included = includedTxForAccount(account); // already sorted newest-first
    const chronological = [...included].sort((a,b) => a.date.localeCompare(b.date));
    let running = 0;
    const points = chronological.map(t => {
      // Deposits are recorded as negative amounts (money leaving checking into savings) and
      // INCREASE the running balance; withdrawals are recorded as positive amounts (money coming
      // back out) and DECREASE it — the inverse of the raw transaction sign.
      const delta = t.amount < 0 ? Math.abs(t.amount) : -Math.abs(t.amount);
      running += delta;
      return { date: t.date, balance: running, description: t.description, amount: delta };
    });
    return points;
  }

  // Current month being viewed (for dashboard + planned summary): derive from filterPeriod, default to actual current month
  const viewedMonth = (filterPeriod !== "all" && filterPeriod !== "ytd") ? filterPeriod : today.toISOString().slice(0,7);

  const plannedThisMonth = plannedExpenses.filter(p => plannedAppliesToMonth(p, viewedMonth));
  const plannedTotal = plannedThisMonth.reduce((s,p) => s+p.amount, 0);
  const plannedByCat = categories.map(c => ({
    ...c,
    total: plannedThisMonth.filter(p => p.category===c.label).reduce((s,p)=>s+p.amount,0),
  })).filter(c => c.total > 0);

  // Overdue planned expenses for the ACTUAL current month (today), regardless of any active
  // period filter — used for the "you have overdue bills" banner on the dashboard.
  const actualCurrentMonth = today.toISOString().slice(0,7);
  const overduePlanned = plannedExpenses.filter(p =>
    plannedAppliesToMonth(p, actualCurrentMonth) && plannedPaymentStatus(p, actualCurrentMonth) === "overdue"
  );

  // Compare planned vs actual for the currently viewed month
  const plannedVsActual = plannedThisMonth.map(p => {
    const cat = catFor(p.category);
    const actualTx = filteredTx.filter(t => t.category===p.category && t.amount<0 &&
      t.description.toLowerCase().includes(p.label.toLowerCase().split(" ")[0]));
    return { ...p, cat, matched: actualTx.length > 0, actualTotal: actualTx.reduce((s,t)=>s+Math.abs(t.amount),0) };
  });

  const importedCount = transactions.filter(t => t.opType).length;
  const [showRemoveImportedModal, setShowRemoveImportedModal] = useState(false);

  // ── Security / PIN management ──
  const [changePinStep, setChangePinStep] = useState(null); // null | "current" | "new" | "confirm"
  const [changePinValue, setChangePinValue] = useState("");
  const [changePinFirst, setChangePinFirst] = useState("");
  const [changePinError, setChangePinError] = useState("");
  const [showDisablePinModal, setShowDisablePinModal] = useState(false);

  const startChangePin = () => { setChangePinStep("current"); setChangePinValue(""); setChangePinError(""); };
  const cancelChangePin = () => { setChangePinStep(null); setChangePinValue(""); setChangePinFirst(""); setChangePinError(""); };

  const submitChangePinStep = async () => {
    const v = changePinValue;
    if (v.length < 4) return;
    if (changePinStep === "current") {
      const record = getPinRecord();
      const hash = await hashPin(v);
      if (record && hash === record.hash) {
        setChangePinStep("new"); setChangePinValue(""); setChangePinError("");
      } else {
        setChangePinError("Nieprawidłowy aktualny PIN");
        setChangePinValue("");
      }
    } else if (changePinStep === "new") {
      setChangePinFirst(v);
      setChangePinValue("");
      setChangePinStep("confirm");
    } else if (changePinStep === "confirm") {
      if (v !== changePinFirst) {
        setChangePinError("Nowe PIN-y nie są zgodne");
        setChangePinValue(""); setChangePinStep("new"); setChangePinFirst("");
      } else {
        const hash = await hashPin(v);
        setPinRecord(hash);
        cancelChangePin();
        setAutoApplyMsg(null);
        flashSave();
      }
    }
  };

  const handleDisablePin = () => {
    clearPinRecord();
    setShowDisablePinModal(false);
    location.reload();
  };

  // ── Export current state, encrypted with the session PIN, into a portable HTML file ──
  const [exportingFile, setExportingFile] = useState(false);
  const [exportMsg, setExportMsg] = useState("");
  const [exportUrl, setExportUrl] = useState(null);
  const [exportFilename, setExportFilename] = useState("");

  const handleExportToFile = async () => {
    if (!sessionPin) {
      setExportMsg("Brak aktywnego PIN-u w tej sesji — odblokuj aplikację ponownie, aby eksportować.");
      return;
    }
    setExportingFile(true);
    setExportMsg("");
    try {
      const payload = { transactions, categories, categoryRules, subcategoryRules, ownerRules, owners, savings, investments, investmentReturn, plannedExpenses, accounts };
      const encrypted = await encryptWithPin(payload, sessionPin);
      const jsonStr = JSON.stringify(encrypted);

      // Build the full HTML from the currently running document, so the exported file
      // always carries the exact same app code the user is using right now.
      const doctype = "<!DOCTYPE html>\n";
      let html = doctype + document.documentElement.outerHTML;

      // Replace (or insert) the embedded-data script contents with the freshly encrypted payload
      if (html.includes('id="embedded-data"')) {
        html = html.replace(
          /<script id="embedded-data" type="application\/json">[\s\S]*?<\/script>/,
          '<script id="embedded-data" type="application/json">' + jsonStr + '<' + '/script>'
        );
      } else {
        html = html.replace(
          '<div id="save-indicator">',
          '<script id="embedded-data" type="application/json">' + jsonStr + '<' + '/script>\n<div id="save-indicator">'
        );
      }

      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const date = new Date().toISOString().slice(0,10);
      const filename = `budzet-domowy-${date}.html`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // Keep the blob URL alive so the manual "Pobierz plik ręcznie" link below stays usable.
      // It will naturally be released when the page is closed/reloaded, or replaced on next export.
      if (exportUrl) URL.revokeObjectURL(exportUrl);

      setExportMsg(`✓ Plik "${filename}" powinien się pobrać. Jeśli nic się nie stało, sprawdź ustawienia przeglądarki dotyczące pobierania plików lub spróbuj otworzyć link poniżej ręcznie.`);
      setExportUrl(url);
      setExportFilename(filename);
    } catch (e) {
      setExportMsg("Błąd eksportu: " + e.message);
    }
    setExportingFile(false);
  };

  const handleRemoveImported = () => {
    if (importedCount === 0) return;
    setShowRemoveImportedModal(true);
  };

  // Count + handler to retroactively strip internal transfers (WŁASNY / WEWNĘTRZNY) that were
  // already imported before this filtering rule existed — without touching anything else.
  function isInternalTransferOpType(opType) {
    if (!opType) return false;
    const op = normalizePolishMojibake(opType.toUpperCase())
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if (op === "PRZELEW NA TWOJE CELE") return false; // keep round-up savings transfers
    return op.includes("WLASNY") || op.includes("WEWNETRZNY");
  }
  // Fallback for legacy/manual entries that lack opType but clearly are internal transfers
  // based on their description alone (mBank's generic title for moving money between own accounts).
  function isInternalTransferTx(t) {
    if (isInternalTransferOpType(t.opType)) return true;
    if (t.opType) return false; // has a recognized opType that's NOT internal — trust it
    const desc = normalizePolishMojibake((t.description || "").toUpperCase())
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/\s+/g, " ")
      .trim();
    return desc.includes("PRZELEW SRODKOW") || desc.includes("PRZELEW WLASNY");
  }
  const internalTransferCount = transactions.filter(isInternalTransferTx).length;
  const [showRemoveInternalModal, setShowRemoveInternalModal] = useState(false);

  const handleRemoveInternalTransfers = () => {
    if (internalTransferCount === 0) return;
    setShowRemoveInternalModal(true);
  };
  const confirmRemoveInternalTransfers = () => {
    setTransactions(prev => prev.filter(t => !isInternalTransferTx(t)));
    setShowRemoveInternalModal(false);
  };

  // ── Plain (unencrypted) JSON export/import — for safely carrying data between
  // different versions of the app's code (e.g. when receiving an updated HTML file).
  // Unlike the encrypted file export above, this does NOT require a PIN: it's meant
  // for the user's own workflow of backing up data before/after an app update, not for
  // transferring data between devices.
  const [dataExportMsg, setDataExportMsg] = useState("");
  const [exportDataUrl, setExportDataUrl] = useState(null);
  const [exportDataText, setExportDataText] = useState("");
  const [showExportTextBox, setShowExportTextBox] = useState(false);
  const [pendingDataImport, setPendingDataImport] = useState(null); // parsed JSON data awaiting confirmation
  const [exportDataFilename, setExportDataFilename] = useState("");
  const [storageInfo, setStorageInfo] = useState(() => getStorageBreakdown());
  const [storageQuota, setStorageQuota] = useState(null); // { usage, quota } from navigator.storage.estimate(), if supported

  const refreshStorageInfo = () => {
    setStorageInfo(getStorageBreakdown());
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(est => {
        setStorageQuota({ usage: est.usage || 0, quota: est.quota || 0 });
      }).catch(() => {});
    }
  };

  const handleExportDataJSON = () => {
    try {
      const payload = {
        transactions, categories, categoryRules, subcategoryRules, ownerRules, owners,
        savings, investments, investmentReturn, plannedExpenses, accounts,
        exportedAt: new Date().toISOString(), version: 1,
      };
      const jsonText = JSON.stringify(payload, null, 2);
      const date = new Date().toISOString().slice(0,10);
      const filename = `budzet-dane-${date}.json`;

      // Use a base64 data: URL instead of a blob: URL — data: URLs are far more reliably
      // handled by mobile browsers' download mechanism. blob: URLs frequently get opened
      // as an in-browser preview instead of triggering an actual file download on phones.
      const base64 = btoa(unescape(encodeURIComponent(jsonText)));
      const dataUrl = `data:application/json;base64,${base64}`;

      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setExportDataUrl(dataUrl);
      setExportDataFilename(filename);
      setExportDataText(jsonText);
      setShowExportTextBox(false);
      setDataExportMsg(`✓ Plik "${filename}" powinien się pobrać automatycznie. Jeśli nic się nie stało, użyj linku lub przycisku "Pokaż dane do skopiowania" poniżej.`);
    } catch (e) {
      setDataExportMsg("Błąd eksportu: " + e.message);
    }
  };

  const handleImportDataJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.transactions || !data.categories) throw new Error("Nieprawidłowy format pliku — brak transakcji lub kategorii.");
        setPendingDataImport(data);
      } catch (err) {
        setDataExportMsg("Błąd importu: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const confirmDataImport = () => {
    const data = pendingDataImport;
    if (!data) return;
    setTransactions(data.transactions);
    setCategories(data.categories);
    setCategoryRules(data.categoryRules || {});
    setSubcategoryRules(data.subcategoryRules || {});
    setOwnerRules(data.ownerRules || {});
    setOwners(data.owners || ["Ty", "Małżonek/Małżonka"]);
    setSavings(data.savings ?? 0);
    setInvestments(data.investments ?? 0);
    setInvestmentReturn(data.investmentReturn ?? 7.2);
    setPlannedExpenses(data.plannedExpenses || []);
    setAccounts(data.accounts || []);
    flashSave();
    setDataExportMsg(`✓ Zaimportowano ${data.transactions.length} transakcji.`);
    setPendingDataImport(null);
  };

  const cancelDataImport = () => setPendingDataImport(null);

  // Alternative to the file picker: let the user paste raw JSON text directly.
  // Useful when file download/selection is unreliable on a given mobile browser.
  const [pasteImportText, setPasteImportText] = useState("");
  const [showPasteImport, setShowPasteImport] = useState(false);

  const handlePasteImport = () => {
    try {
      const data = JSON.parse(pasteImportText);
      if (!data.transactions || !data.categories) throw new Error("Nieprawidłowy format — brak transakcji lub kategorii.");
      setPendingDataImport(data);
      setShowPasteImport(false);
      setPasteImportText("");
    } catch (err) {
      setDataExportMsg("Błąd importu: " + err.message);
    }
  };

  const handleCopyExportText = async () => {
    try {
      await navigator.clipboard.writeText(exportDataText);
      setDataExportMsg("✓ Skopiowano dane do schowka. Wklej je w nowej wersji aplikacji.");
    } catch {
      setShowExportTextBox(true);
      setDataExportMsg("Nie udało się skopiować automatycznie — zaznacz i skopiuj tekst poniżej ręcznie.");
    }
  };

  const confirmRemoveImported = () => {
    setTransactions(prev => prev.filter(t => !t.opType));
    setShowRemoveImportedModal(false);
  };

  const [pendingDelete, setPendingDelete] = useState(null); // transaction object awaiting confirmation

  const handleDeleteTransaction = (id) => {
    const tx = transactions.find(t => t.id === id);
    if (!tx) return;
    setPendingDelete(tx);
  };

  const confirmDelete = () => {
    if (!pendingDelete) return;
    setTransactions(prev => prev.filter(t => t.id !== pendingDelete.id));
    setPendingDelete(null);
  };

  const cancelDelete = () => setPendingDelete(null);

  const handleUpdateCategory = (id, newCategory, onlyThisOne) => {
    const tx = transactions.find(t => t.id===id);
    if (!tx) return;

    if (onlyThisOne) {
      // Edit just this single transaction — no rule saved, nothing else affected
      setTransactions(prev => prev.map(t => t.id===id ? { ...t, category:newCategory, subcategory:undefined } : t));
      return;
    }

    const key = tx.description.trim().toLowerCase();
    setCategoryRules(prev => ({ ...prev, [key]: newCategory }));
    // The old subcategory rule (if any) belonged to the previous category — drop it, since
    // a subcategory only makes sense in the context of its specific parent category.
    setSubcategoryRules(prev => { const next = { ...prev }; delete next[key]; return next; });
    const affected = transactions.filter(t => t.description.trim().toLowerCase()===key && t.id!==id).length;
    // Changing the main category clears any subcategory (it likely belonged to the old category)
    setTransactions(prev => prev.map(t => t.description.trim().toLowerCase()===key ? {...t,category:newCategory,subcategory:undefined} : t));
    if (affected > 0) {
      setAutoApplyMsg({ count: affected, category: newCategory });
      setTimeout(() => setAutoApplyMsg(null), 3500);
    }
  };

  // Set/clear the subcategory for a transaction. By default also auto-applies the same
  // subcategory to every other transaction sharing the same description (same pattern as
  // handleUpdateCategory) — unless onlyThisOne is set, in which case only this transaction changes.
  const handleSetSubcategory = (id, subcategory, onlyThisOne) => {
    const tx = transactions.find(t => t.id===id);
    if (!tx) return;

    if (onlyThisOne) {
      setTransactions(prev => prev.map(t => t.id===id ? { ...t, subcategory } : t));
      return;
    }

    const key = tx.description.trim().toLowerCase();
    setSubcategoryRules(prev => {
      const next = { ...prev };
      if (subcategory) next[key] = subcategory;
      else delete next[key];
      return next;
    });
    const affected = transactions.filter(t =>
      t.description.trim().toLowerCase()===key && t.category===tx.category && t.id!==id
    ).length;
    setTransactions(prev => prev.map(t =>
      (t.description.trim().toLowerCase()===key && t.category===tx.category) ? { ...t, subcategory } : t
    ));
    if (affected > 0) {
      setAutoApplyMsg({ count: affected, category: subcategory ? `${tx.category} · ${subcategory}` : tx.category });
      setTimeout(() => setAutoApplyMsg(null), 3500);
    }
  };

  // If, after a category/subcategory change, a transaction no longer matches the account it's
  // currently folded into, remove its contribution from the account's balance and untrack it.
  function reconcileAccountAfterCategoryChange(accountId, txId, newCategory, newSubcategory) {
    const account = accounts.find(a => a.id === accountId);
    const tx = transactions.find(t => t.id === txId);
    if (!account || !tx) return;
    const stillMatches = (account.linkedCategories || []).some(link =>
      link.category === newCategory && (!link.subcategory || link.subcategory === newSubcategory)
    );
    if (stillMatches) return;
    setAccounts(prev => prev.map(a => {
      if (a.id !== accountId) return a;
      return {
        ...a,
        balance: (a.balance || 0) - Math.abs(tx.amount),
        includedTxIds: (a.includedTxIds || []).filter(id => id !== txId),
      };
    }));
  }

  // Change the category of a transaction that's already part of an account's balance, then
  // reconcile: if it no longer matches the account's links, subtract it back out automatically.
  const handleChangeAccountTxCategory = (accountId, txId, newCategory, onlyThisOne) => {
    handleUpdateCategory(txId, newCategory, onlyThisOne);
    reconcileAccountAfterCategoryChange(accountId, txId, newCategory, undefined);
  };

  // Same reconciliation, but for changing just the subcategory.
  const handleChangeAccountTxSubcategory = (accountId, txId, newSubcategory, onlyThisOne) => {
    const tx = transactions.find(t => t.id === txId);
    handleSetSubcategory(txId, newSubcategory, onlyThisOne);
    reconcileAccountAfterCategoryChange(accountId, txId, tx ? tx.category : undefined, newSubcategory);
  };

  // Set the owner ("Ty" / "Małżonek" / etc.) for a transaction. By default also auto-applies
  // to every other transaction sharing the same description — unless onlyThisOne is set.
  const handleSetOwner = (id, owner, onlyThisOne) => {
    const tx = transactions.find(t => t.id===id);
    if (!tx) return;

    if (onlyThisOne) {
      setTransactions(prev => prev.map(t => t.id===id ? { ...t, owner } : t));
      return;
    }

    const key = tx.description.trim().toLowerCase();
    setOwnerRules(prev => ({ ...prev, [key]: owner }));
    const affected = transactions.filter(t => t.description.trim().toLowerCase()===key && t.id!==id).length;
    setTransactions(prev => prev.map(t => t.description.trim().toLowerCase()===key ? { ...t, owner } : t));
    if (affected > 0) {
      setAutoApplyMsg({ count: affected, category: `właściciel: ${owner}` });
      setTimeout(() => setAutoApplyMsg(null), 3500);
    }
  };

  const handleAddCategory = () => {
    if (!newCatForm.label.trim()) return;
    if (categories.find(c => c.label===newCatForm.label.trim())) return;
    setCategories(prev => [...prev.slice(0,-1), { label:newCatForm.label.trim(), icon:newCatForm.icon, color:newCatForm.color, subcategories:[] }, prev[prev.length-1]]);
    setNewCatForm(f => ({ label:"", icon:"📦", color: pickDistinctColor([...categories.map(c=>c.color), f.color]) }));
    setShowNewCat(false);
  };

  const handleDeleteCategory = (label) => {
    if (label==="Inne") return;
    setPendingDeleteCategory(label);
  };

  const confirmDeleteCategory = () => {
    const label = pendingDeleteCategory;
    if (!label) return;
    setCategories(prev => prev.filter(c => c.label!==label));
    setTransactions(prev => prev.map(t => t.category===label ? {...t,category:"Inne",subcategory:undefined} : t));
    setPendingDeleteCategory(null);
  };

  const cancelDeleteCategory = () => setPendingDeleteCategory(null);

  // Move a category one position up or down in the list (swap with its neighbor).
  // "Inne" is intentionally not locked in place here — the user can reorder freely,
  // it just always exists and can't be deleted.
  // Move the category at `fromIndex` to sit at `toIndex`, shifting everything between.
  function reorderCategories(fromIndex, toIndex) {
    if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0) return;
    setCategories(prev => {
      const next = [...prev];
      const [moved] = next.splice(fromIndex, 1);
      next.splice(toIndex, 0, moved);
      return next;
    });
  }

  // Move account `draggedId` to sit right before/after account `targetId`, but only ever
  // reordering within accounts of the SAME type — savings accounts and investment accounts
  // are two visually separate lists, so dragging one onto the other list is a no-op.
  function reorderAccounts(draggedId, targetId) {
    if (draggedId === targetId) return;
    setAccounts(prev => {
      const dragged = prev.find(a => a.id === draggedId);
      const target = prev.find(a => a.id === targetId);
      if (!dragged || !target || dragged.type !== target.type) return prev;
      const next = [...prev];
      const fromIdx = next.findIndex(a => a.id === draggedId);
      next.splice(fromIdx, 1);
      const toIdx = next.findIndex(a => a.id === targetId);
      next.splice(toIdx, 0, dragged);
      return next;
    });
  }

  // ── Desktop drag-and-drop for accounts (native HTML5 DnD) ──
  const handleAccountDragStart = (id) => setDragAccountId(id);
  const handleAccountDragOver = (e, id) => { e.preventDefault(); setDragOverAccountId(id); };
  const handleAccountDrop = (id) => {
    if (dragAccountId !== null) reorderAccounts(dragAccountId, id);
    setDragAccountId(null);
    setDragOverAccountId(null);
  };
  const handleAccountDragEnd = () => { setDragAccountId(null); setDragOverAccountId(null); };

  // ── Mobile drag-and-drop for accounts (manual touch tracking) ──
  const handleAccountTouchStart = (id) => setDragAccountId(id);
  const handleAccountTouchMove = (e) => {
    if (dragAccountId === null) return;
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const row = el && el.closest ? el.closest("[data-account-id]") : null;
    if (row) {
      const id = parseInt(row.getAttribute("data-account-id"), 10);
      if (!isNaN(id)) setDragOverAccountId(id);
    }
  };
  const handleAccountTouchEnd = () => {
    if (dragAccountId !== null && dragOverAccountId !== null) reorderAccounts(dragAccountId, dragOverAccountId);
    setDragAccountId(null);
    setDragOverAccountId(null);
  };

  // ── Desktop drag-and-drop (native HTML5 DnD) ──
  const handleCatDragStart = (idx) => setDragCatIndex(idx);
  const handleCatDragOver = (e, idx) => { e.preventDefault(); setDragOverCatIndex(idx); };
  const handleCatDrop = (idx) => {
    if (dragCatIndex !== null) reorderCategories(dragCatIndex, idx);
    setDragCatIndex(null);
    setDragOverCatIndex(null);
  };
  const handleCatDragEnd = () => { setDragCatIndex(null); setDragOverCatIndex(null); };

  // ── Mobile drag-and-drop (manual touch tracking — native HTML5 DnD doesn't work reliably on touch) ──
  const handleCatTouchStart = (idx) => setDragCatIndex(idx);
  const handleCatTouchMove = (e) => {
    if (dragCatIndex === null) return;
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const row = el && el.closest ? el.closest("[data-cat-index]") : null;
    if (row) {
      const idx = parseInt(row.getAttribute("data-cat-index"), 10);
      if (!isNaN(idx)) setDragOverCatIndex(idx);
    }
  };
  const handleCatTouchEnd = () => {
    if (dragCatIndex !== null && dragOverCatIndex !== null) reorderCategories(dragCatIndex, dragOverCatIndex);
    setDragCatIndex(null);
    setDragOverCatIndex(null);
  };

  // Rename a category's label in-place: existing transactions keep pointing to the SAME
  // category (just under its new name), instead of being reassigned to "Inne" like a delete would.
  const handleRenameCategory = (oldLabel, newLabel) => {
    const trimmed = newLabel.trim();
    if (!trimmed || trimmed === oldLabel) return false;
    if (categories.some(c => c.label === trimmed)) return false; // name already taken
    setCategories(prev => prev.map(c => c.label===oldLabel ? { ...c, label: trimmed } : c));
    setTransactions(prev => prev.map(t => t.category===oldLabel ? { ...t, category: trimmed } : t));
    setCategoryRules(prev => {
      const next = {};
      for (const [k, v] of Object.entries(prev)) next[k] = v === oldLabel ? trimmed : v;
      return next;
    });
    setPlannedExpenses(prev => prev.map(p => p.category===oldLabel ? { ...p, category: trimmed } : p));
    return true;
  };

  // ── Subcategory management ──
  const [newSubcatLabel, setNewSubcatLabel] = useState("");
  const [editingSubcatsFor, setEditingSubcatsFor] = useState(null); // category label currently being edited
  const [renamingCategory, setRenamingCategory] = useState(null); // category label currently being renamed
  const [pendingDeleteCategory, setPendingDeleteCategory] = useState(null); // category label awaiting delete confirmation
  const [dragCatIndex, setDragCatIndex] = useState(null); // index of category currently being dragged
  const [dragOverCatIndex, setDragOverCatIndex] = useState(null); // index currently being dragged over
  const [dragAccountId, setDragAccountId] = useState(null); // id of account currently being dragged
  const [dragOverAccountId, setDragOverAccountId] = useState(null); // id of account currently being dragged over
  const [renameValue, setRenameValue] = useState("");
  const [renameError, setRenameError] = useState("");

  const handleAddSubcategory = (categoryLabel) => {
    const name = newSubcatLabel.trim();
    if (!name) return;
    setCategories(prev => prev.map(c => {
      if (c.label !== categoryLabel) return c;
      const existing = c.subcategories || [];
      if (existing.includes(name)) return c;
      return { ...c, subcategories: [...existing, name] };
    }));
    setNewSubcatLabel("");
  };

  const handleDeleteSubcategory = (categoryLabel, subcatName) => {
    setCategories(prev => prev.map(c => {
      if (c.label !== categoryLabel) return c;
      return { ...c, subcategories: (c.subcategories||[]).filter(s => s !== subcatName) };
    }));
    // Clear this subcategory from any transactions that used it
    setTransactions(prev => prev.map(t =>
      (t.category===categoryLabel && t.subcategory===subcatName) ? { ...t, subcategory: undefined } : t
    ));
    // Drop any saved rules that pointed to this now-deleted subcategory
    setSubcategoryRules(prev => {
      const next = {};
      for (const [k, v] of Object.entries(prev)) if (v !== subcatName) next[k] = v;
      return next;
    });
  };

  const startRenameCategory = (label) => {
    setRenamingCategory(label);
    setRenameValue(label);
    setRenameError("");
  };

  const cancelRenameCategory = () => {
    setRenamingCategory(null);
    setRenameValue("");
    setRenameError("");
  };

  const confirmRenameCategory = () => {
    const ok = handleRenameCategory(renamingCategory, renameValue);
    if (ok) {
      cancelRenameCategory();
    } else {
      const trimmed = renameValue.trim();
      if (!trimmed) setRenameError("Nazwa nie może być pusta");
      else if (trimmed === renamingCategory) cancelRenameCategory(); // no-op, just close
      else setRenameError("Kategoria z tą nazwą już istnieje");
    }
  };

  // ── Subcategory rename (triggered by long-press) ──
  const [renamingSubcat, setRenamingSubcat] = useState(null); // { category, subcat } currently being renamed
  const [renameSubcatValue, setRenameSubcatValue] = useState("");
  const [renameSubcatError, setRenameSubcatError] = useState("");
  const longPressTimerRef = useRef(null);

  // Rename a subcategory in-place: existing transactions keep pointing to the SAME
  // subcategory (just under its new name), instead of losing the assignment.
  const handleRenameSubcategory = (categoryLabel, oldSub, newSub) => {
    const trimmed = newSub.trim();
    if (!trimmed || trimmed === oldSub) return false;
    const cat = categories.find(c => c.label === categoryLabel);
    if (cat && (cat.subcategories||[]).includes(trimmed)) return false; // name already taken
    setCategories(prev => prev.map(c => c.label!==categoryLabel ? c : {
      ...c, subcategories: (c.subcategories||[]).map(s => s===oldSub ? trimmed : s),
    }));
    setTransactions(prev => prev.map(t =>
      (t.category===categoryLabel && t.subcategory===oldSub) ? { ...t, subcategory: trimmed } : t
    ));
    setSubcategoryRules(prev => {
      const next = {};
      for (const [k, v] of Object.entries(prev)) next[k] = v === oldSub ? trimmed : v;
      return next;
    });
    return true;
  };

  // Rename a household member ("Ty" → "Anna", etc.) — updates every transaction, rule, and
  // the active owner filter if it currently points at the renamed person.
  const handleRenameOwner = (index, newName) => {
    const trimmed = newName.trim();
    const oldName = owners[index];
    if (!trimmed || trimmed === oldName) return false;
    if (owners.includes(trimmed)) return false; // name already taken
    setOwners(prev => prev.map((o,i) => i===index ? trimmed : o));
    setTransactions(prev => prev.map(t => (t.owner || owners[0])===oldName ? { ...t, owner: trimmed } : t));
    setOwnerRules(prev => {
      const next = {};
      for (const [k, v] of Object.entries(prev)) next[k] = v === oldName ? trimmed : v;
      return next;
    });
    if (ownerFilter === oldName) setOwnerFilter(trimmed);
    return true;

    setRenamingSubcat(null);

    if (!renamingSubcat) return;
    const ok = handleRenameSubcategory(renamingSubcat.category, renamingSubcat.subcat, renameSubcatValue);

      cancelRenameSubcategory();
    } else {
      const trimmed = renameSubcatValue.trim();
      if (!trimmed) setRenameSubcatError("Nazwa nie może być pusta");
      else if (trimmed === renamingSubcat.subcat) cancelRenameSubcategory();

  const handleSubcatPressStart = (categoryLabel, subcat) => {
    clearTimeout(longPressTimerRef.current);
    longPressTimerRef.current = setTimeout(() => {

            {plannedThisMonth.length > 0 && (

                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>

                <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
