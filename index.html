<script>
  // Show fallback error if React fails to render within 5 seconds
  window.__appLoaded = false;
  window.__lastErrorMsg = "";
  setTimeout(function() {
    if (!window.__appLoaded) {
      var el = document.getElementById('fallback-error');
      el.classList.add('show');
      if (window.__lastErrorMsg) {
        var codeBlock = document.createElement('div');
        codeBlock.style.marginTop = '12px';
        codeBlock.style.fontSize = '11px';
        codeBlock.style.color = '#F87171';
        codeBlock.style.wordBreak = 'break-all';
        codeBlock.textContent = window.__lastErrorMsg;
        el.appendChild(codeBlock);
      }
    }
  }, 5000);
  window.addEventListener('error', function(e) {
    console.error('Global error:', e.message, e.filename, e.lineno);
    window.__lastErrorMsg = e.message + ' (line ' + e.lineno + ')';
  });
  window.addEventListener('unhandledrejection', function(e) {
    console.error('Unhandled promise rejection:', e.reason);
    window.__lastErrorMsg = String(e.reason && e.reason.message || e.reason);
    if (!window.__appLoaded) {
      document.getElementById('fallback-error').classList.add('show');
    }
  });
  // Detect missing Web Crypto API early — common cause: non-secure context, very old browser,
  // or some restricted in-app WebViews. file:// pages are normally treated as secure, but not always.
  if (!window.crypto || !window.crypto.subtle) {
    window.__lastErrorMsg = "Brak dostępu do Web Crypto API (crypto.subtle). Ta funkcja jest wymagana do działania blokady PIN. Otwórz plik w nowoczesnej przeglądarce (Chrome, Safari, Firefox) — nie w aplikacji typu 'WebView' czy podglądzie plików.";
    document.getElementById('fallback-error').classList.add('show');
  }
</script>

<!-- ── PWA setup ──────────────────────────────────────────────────────────────
     Everything needed for "Add to Home screen" / native install on Android Chrome,
     built entirely inline so the app stays a single portable .html file:
       1. Draw an app icon on a <canvas> and export it as a PNG data: URL.
       2. Build a manifest.json on the fly (also as a data: URL) referencing that icon.
       3. Register a tiny Service Worker (built from a Blob, no separate file needed).
     Chrome requires all three — a manifest, an icon, and an active Service Worker —
     before it will offer to install a page as an app. This only works over https://
     (or on localhost) — it intentionally does nothing on file:// since that's a
     browser-level restriction we can't work around from inside the page. -->
<script>
(function setupPWA() {
  function drawIconDataURL(size) {
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    var r = size * 0.22;
    ctx.fillStyle = '#0F1117';
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(size-r, 0); ctx.quadraticCurveTo(size,0,size,r);
    ctx.lineTo(size, size-r); ctx.quadraticCurveTo(size,size,size-r,size);
    ctx.lineTo(r, size); ctx.quadraticCurveTo(0,size,0,size-r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath(); ctx.fill();
    ctx.font = (size*0.6) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💰', size/2, size/2 + size*0.04);
    return canvas.toDataURL('image/png');
  }

  // Only attempt PWA setup in a context where it can actually work
  var isSecureish = location.protocol === 'https:' || location.hostname === 'localhost';
  if (!isSecureish) return;

  try {
    var icon192 = drawIconDataURL(192);
    var icon512 = drawIconDataURL(512);

    document.getElementById('pwa-icon').href = icon192;
    document.getElementById('pwa-apple-icon').href = icon192;

    var manifest = {
      name: "Budżet Domowy",
      short_name: "Budżet",
      description: "Osobisty budżet domowy — wydatki, przychody, oszczędności i inwestycje",
      start_url: location.pathname + location.search,
      scope: location.pathname,
      display: "standalone",
      orientation: "portrait",
      background_color: "#0F1117",
      theme_color: "#0F1117",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

    // Minimal Service Worker: just enough for Chrome's installability checks and a basic
    // offline shell. It intentionally does very little — this app's real data lives in
    // localStorage, not in cached network requests.
    var swSource = [
      'self.addEventListener("install", function(e){ self.skipWaiting(); });',
      'self.addEventListener("activate", function(e){ self.clients.claim(); });',
      'self.addEventListener("fetch", function(e){',
      '  e.respondWith(fetch(e.request).catch(function(){ return caches.match(e.request); }));',
      '});'
    ].join('\n');
    var swBlob = new Blob([swSource], { type: "application/javascript" });
    var swUrl = URL.createObjectURL(swBlob);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(swUrl).catch(function(err) {
        console.warn('Service worker registration failed (PWA install may be unavailable):', err);
      });
    }
  } catch (err) {
    console.warn('PWA setup failed:', err);
  }

  // Capture the native install prompt and show our own banner instead of waiting for the
  // browser's address-bar icon, which people often miss entirely.
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!sessionStorage.getItem('pwa_install_dismissed')) {
      document.getElementById('install-banner').classList.add('show');
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    var installBtn = document.getElementById('install-banner-install');
    var dismissBtn = document.getElementById('install-banner-dismiss');
    if (installBtn) installBtn.addEventListener('click', function() {
      document.getElementById('install-banner').classList.remove('show');
      if (deferredPrompt) deferredPrompt.prompt();
    });
    if (dismissBtn) dismissBtn.addEventListener('click', function() {
      document.getElementById('install-banner').classList.remove('show');
      sessionStorage.setItem('pwa_install_dismissed', '1');
    });
  });

  window.addEventListener('appinstalled', function() {
    document.getElementById('install-banner').classList.remove('show');
  });
})();
</script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── LocalStorage helpers ─────────────────────────────────────────────────────
const LS_KEY = "budzet_domowy_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveState(state) {

}

// ─── Storage usage measurement ────────────────────────────────────────────────
// Most browsers cap localStorage at 5–10 MB per origin. There's no direct API to ask
// "how much space is left", so we measure what we can: the actual byte size of every
// key currently stored (UTF-16 in memory, but values are written as UTF-8-ish ASCII/JSON
// strings, so .length in characters is a close, slightly conservative proxy for bytes),
// plus a breakdown of which key is using how much. We compare against a conservative
// 5 MB assumption since that's the lowest common denominator across browsers.
const STORAGE_CONSERVATIVE_LIMIT_BYTES = 5 * 1024 * 1024;

function getStorageBreakdown() {
  const items = [];
  let total = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const value = localStorage.getItem(key) || "";
      const bytes = new Blob([value]).size;
      items.push({ key, bytes });
      total += bytes;
    }
  } catch { /* ignore */ }
  items.sort((a,b) => b.bytes - a.bytes);
  return { items, total };
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(2) + " MB";
}

// ─── Firebase cloud sync setup ────────────────────────────────────────────────
// Firebase's apiKey is meant to be public (it's not a secret — it just identifies
// which Firebase project to talk to). Actual access control happens via Firestore
// Security Rules + Firebase Auth, configured in the Firebase console, not by hiding
// this key. Anonymous Auth is used purely so Firestore's rules can require "some"
// authenticated request — the real access boundary is knowing the PIN-derived doc ID.
const firebaseConfig = {
  apiKey: "AIzaSyDfRgrUdAW08F5LADMD33fZmtbgvJ3IJ-o",
  authDomain: "budzet-domowy-e0500.firebaseapp.com",
  projectId: "budzet-domowy-e0500",
  storageBucket: "budzet-domowy-e0500.firebasestorage.app",
  messagingSenderId: "494995534981",
  appId: "1:494995534981:web:78fcc83b74b270b85665ec",
};

let firebaseApp = null, firebaseAuth = null, firebaseDb = null, firebaseInitError = null;
function initFirebase() {
  if (firebaseApp || firebaseInitError) return;
  try {
    // Firebase Auth (and by extension, anything requiring it) refuses to run when the page is
    // opened directly from disk — it requires the page to be served over http://, https://, or
    // chrome-extension://. This is a hard requirement of the Firebase SDK itself, not something
    // fixable from inside the page, so detect it specifically and explain it accurately instead
    // of leaving the user staring at a generic "check your internet connection" message when
    // their internet connection is actually fine.
    if (location.protocol === "file:") {
      throw new Error("Synchronizacja w chmurze wymaga otwarcia aplikacji przez http:// lub https:// — nie działa, gdy plik jest otwarty bezpośrednio z dysku (file://). To ograniczenie samego Firebase, nie da się go obejść z poziomu aplikacji. Wgraj plik na hosting (np. Netlify, GitHub Pages) i otwórz go stamtąd, żeby zacząć korzystać z synchronizacji.");
    }
    if (typeof firebase === "undefined") throw new Error("Firebase SDK nie wczytało się — sprawdź połączenie internetowe i odśwież stronę.");
    firebaseApp = firebase.initializeApp(firebaseConfig);
    firebaseAuth = firebase.auth();
    firebaseDb = firebase.firestore();
  } catch (err) {
    firebaseInitError = err;
    console.warn("Firebase init failed:", err);
  }
}

// Ensure we have an authenticated (anonymous) session before touching Firestore.
function ensureFirebaseAuth() {
  return new Promise((resolve, reject) => {
    initFirebase();
    if (firebaseInitError) { reject(firebaseInitError); return; }
    const unsub = firebaseAuth.onAuthStateChanged(user => {
      unsub();
      if (user) { resolve(user); return; }
      firebaseAuth.signInAnonymously().then(cred => resolve(cred.user)).catch(reject);
    });
  });
}

// Upload the current app state to this household's cloud document, encrypted with the PIN.
async function syncPushToCloud(pin, payload) {
  await ensureFirebaseAuth();
  const docId = await deriveSyncDocId(pin);
  const encrypted = await encryptWithPin(payload, pin);
  await firebaseDb.collection("budgets").doc(docId).set({
    ...encrypted,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
  return docId;
}

// Download and decrypt this household's cloud document, if one exists.
async function syncPullFromCloud(pin) {
  await ensureFirebaseAuth();
  const docId = await deriveSyncDocId(pin);
  const snap = await firebaseDb.collection("budgets").doc(docId).get();
  if (!snap.exists) return null;
  const data = snap.data();
  if (!data || !data.salt || !data.iv || !data.data) return null;
  const decrypted = await decryptWithPin(data, pin);
  return { payload: decrypted, updatedAt: data.updatedAt ? data.updatedAt.toMillis() : 0 };
}

// Subscribe to live changes on this household's cloud document. Calls onChange(payload, updatedAtMillis)
// whenever the document changes (including changes pushed from this app — caller should de-dupe by
// comparing updatedAt against the last known value). Returns an unsubscribe function.
function syncListenToCloud(pin, docId, onChange, onError) {
  return firebaseDb.collection("budgets").doc(docId).onSnapshot(
    async snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (!data || !data.salt || !data.iv || !data.data) return;
      try {
        const decrypted = await decryptWithPin(data, pin);
        onChange(decrypted, data.updatedAt ? data.updatedAt.toMillis() : Date.now());
      } catch (err) {
        onError && onError(err);
      }
    },
    err => onError && onError(err)
  );
}

// ─── PIN lock helpers ─────────────────────────────────────────────────────────
const PIN_KEY = "budzet_domowy_pin_v1";
const LOCKOUT_KEY = "budzet_domowy_lockout_v1";
const SESSION_KEY = "budzet_domowy_unlocked"; // sessionStorage — cleared when tab/browser closes

// Hash the PIN with SHA-256 so the raw digits are never stored in localStorage
async function hashPin(pin) {
  const enc = new TextEncoder().encode("budzet-salt-" + pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function getPinRecord() {
  try {
    const raw = localStorage.getItem(PIN_KEY);
    return raw ? JSON.parse(raw) : null; // { hash: "..." }
  } catch { return null; }
}

function setPinRecord(hash) {
  localStorage.setItem(PIN_KEY, JSON.stringify({ hash }));
}

function clearPinRecord() {
  localStorage.removeItem(PIN_KEY);
  localStorage.removeItem(LOCKOUT_KEY);
  sessionStorage.removeItem(SESSION_KEY);
}

function getLockout() {
  try {
    const raw = localStorage.getItem(LOCKOUT_KEY);
    return raw ? JSON.parse(raw) : { attempts: 0, lockedUntil: 0 };
  } catch { return { attempts: 0, lockedUntil: 0 }; }
}

function setLockout(data) {
  localStorage.setItem(LOCKOUT_KEY, JSON.stringify(data));
}

function isUnlockedThisSession() {
  return sessionStorage.getItem(SESSION_KEY) === "1";
}

function markUnlockedThisSession(pin) {
  sessionStorage.setItem(SESSION_KEY, "1");
  // Also remember the PIN itself for the duration of this tab session (cleared when the tab
  // closes, same lifetime as the "unlocked" flag above) — needed so features like cloud sync
  // can still derive the encryption key after a page reload that skips the PIN screen because
  // isUnlockedThisSession() is already true.
  try { sessionStorage.setItem(SESSION_KEY + "_pin", pin); } catch {}
}

function getRememberedSessionPin() {
  try { return sessionStorage.getItem(SESSION_KEY + "_pin"); } catch { return null; }
}

// Whether the Web Crypto API (needed for PIN hashing and AES export) is available.
// Missing in some restricted WebViews / non-secure contexts.
function hasCrypto() {
  return !!(window.crypto && window.crypto.subtle);
}

// ─── AES-256-GCM encryption for portable file export ─────────────────────────
// The PIN is used (via PBKDF2) to derive an encryption key. This lets the user
// embed their encrypted data directly inside the HTML file, so the file itself
// becomes portable between devices — without ever storing the PIN or plaintext
// data in the file.

async function deriveKey(pin, saltBytes) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: 150000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

function bufToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

// Encrypt a JS object with the given PIN. Returns a portable { salt, iv, data } object (all base64).
async function encryptWithPin(obj, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pin, salt);
  const enc = new TextEncoder().encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, enc);
  return { salt: bufToBase64(salt), iv: bufToBase64(iv), data: bufToBase64(cipherBuf) };
}

// Decrypt a { salt, iv, data } object with the given PIN. Throws if PIN is wrong or data is corrupt.
async function decryptWithPin(payload, pin) {
  const salt = base64ToBuf(payload.salt);
  const iv = base64ToBuf(payload.iv);
  const key = await deriveKey(pin, salt);
  const cipherBuf = base64ToBuf(payload.data);
  const plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, cipherBuf);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// Read the encrypted payload embedded in this very HTML file, if present
function readEmbeddedPayload() {
  const el = document.getElementById("embedded-data");
  if (!el || !el.textContent.trim()) return null;
  try { return JSON.parse(el.textContent); } catch { return null; }
}

// ─── Cloud sync (Firebase) ────────────────────────────────────────────────────
// The PIN doubles as the "address" for this household's data in the cloud: both
// devices derive the SAME Firestore document ID from the same PIN (via a hash with
// its own salt, distinct from the local-verification hash above), so they naturally
// land on the same document without any separate pairing-code exchange. The actual
// document content is AES-encrypted with the PIN before upload — Firebase (and anyone
// with read access to the project) only ever sees ciphertext, never plaintext data.
async function deriveSyncDocId(pin) {
  const enc = new TextEncoder().encode("budzet-sync-doc-" + pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// Pick a color from COLOR_OPTIONS that is most visually different from already-used colors
function pickDistinctColor(usedColors) {
  // Parse hex to [r,g,b]
  const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  // Perceptual distance between two colors
  const dist = (a,b) => { const [ar,ag,ab]=hex2rgb(a), [br,bg,bb]=hex2rgb(b); return Math.sqrt((ar-br)**2+(ag-bg)**2+(ab-bb)**2); };
  // For each candidate, find its minimum distance to any used color
  const candidates = COLOR_OPTIONS.filter(c => !usedColors.includes(c));
  if (candidates.length === 0) {
    // All used — pick the one with max min-distance
    return COLOR_OPTIONS.reduce((best, c) => {
      const minD = usedColors.reduce((m, u) => Math.min(m, dist(c, u)), Infinity);
      const bestD = usedColors.reduce((m, u) => Math.min(m, dist(best, u)), Infinity);
      return minD > bestD ? c : best;
    }, COLOR_OPTIONS[0]);
  }
  return candidates.reduce((best, c) => {
    const minD = usedColors.reduce((m, u) => Math.min(m, dist(c, u)), Infinity);
    const bestD = usedColors.reduce((m, u) => Math.min(m, dist(best, u)), Infinity);
    return minD > bestD ? c : best;
  }, candidates[0]);
}

async function callClaude(prompt, systemMsg) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 1000,
      system: systemMsg,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.[0]?.text || "";
}

// ─── mBank CSV parser ─────────────────────────────────────────────────────────
// mBank's CSV export is sometimes mis-decoded (Windows-1250 read as Latin-1/Mac Roman),
// turning Polish letters into garbage characters like "£" instead of "Ł". Map the common
// mis-decoded variants back to plain ASCII equivalents before matching, so detection works
// regardless of which mangled encoding the file ended up in.
function normalizePolishMojibake(s) {
  return s
    .replace(/£/g, "L")
    .replace(/¥/g, "A")
    .replace(/¯|¿/g, "Z")
    .replace(/Œ/g, "S")
    .replace(/œ/g, "s")
    .replace(/Ñ/g, "N")
    .replace(/ñ/g, "n")
    .replace(/Ó/g, "O");
}

// Fixes the SAME mis-decoding as above, but restores real Polish diacritics for display
// purposes (e.g. "£UKASZ" → "ŁUKASZ", "WIŒNIOWA" → "WIŚNIOWA") instead of flattening to ASCII.
// This is the Windows-1250 → Latin-1 (ISO-8859-1) mis-decoding mBank's older CSV exports produce.
function fixPolishMojibakeForDisplay(s) {
  if (!s || typeof s !== "string") return s;
  const map = {
    "¥":"Ą", "¹":"ą",
    "Æ":"Ć", "æ":"ć",
    "£":"Ł", "³":"ł",
    "Ñ":"Ń", "ñ":"ń",
    "Ó":"Ó", "ó":"ó",
    "Œ":"Ś", "œ":"ś",
    "¯":"Ż", "¿":"ż",
    "¬":"Ź", "¼":"ź",
    "Ê":"Ę", "ê":"ę",
  };
  let out = "";
  for (const ch of s) out += map[ch] ?? ch;
  return out;
}

// One-time migration: fix mis-decoded Polish characters in already-saved transactions
// (and their related text fields) without needing the user to re-import their statement.
function migrateTransactionEncoding(txs) {
  if (!txs || txs.length === 0) return txs;
  const looksMangled = /[£¥¹ÆæÓ³ÑñÓóŒœ¯¿¬¼Êê]/;
  return txs.map(t => {
    const needsFix = (t.description && looksMangled.test(t.description))
      || (t.title && looksMangled.test(t.title))
      || (t.senderRecipient && looksMangled.test(t.senderRecipient));
    if (!needsFix) return t;
    return {
      ...t,
      description: fixPolishMojibakeForDisplay(t.description),
      title: t.title ? fixPolishMojibakeForDisplay(t.title) : t.title,
      senderRecipient: t.senderRecipient ? fixPolishMojibakeForDisplay(t.senderRecipient) : t.senderRecipient,
    };
  });
}

function parseMbankCSV(text) {
  const rows = [];
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    if (line.startsWith("#Data") || line.startsWith("Data ksi")) continue;
    let raw = line;
    if (raw.startsWith('"') && raw.endsWith(';"')) raw = raw.slice(1, -1);
    else if (raw.startsWith('"')) raw = raw.slice(1);
    const fields = []; let buf = "", inQ = false;
    for (let i = 0; i < raw.length; i++) {
      const ch = raw[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ';' && !inQ) { fields.push(buf.trim()); buf = ""; }
      else buf += ch;
    }
    if (buf.trim()) fields.push(buf.trim());
    if (fields.length < 7) continue;
    const [, dateOp, opType, title, senderRecipient, account, amountRaw] = fields;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateOp)) continue;
    const amount = parseFloat(amountRaw.replace(/\s/g,"").replace(",","."));
    if (isNaN(amount)) continue;

    // mBank sometimes embeds the ACTUAL transaction date inside the title itself, e.g. for card
    // purchases: "...DATA TRANSAKCJI: 2026-01-03". When present and different from the date in
    // the dedicated date column, this embedded date is the more accurate one (the column date can
    // reflect when mBank processed/booked it, not when the purchase actually happened) — prefer it.
    const dataTransakcjiMatch = title.match(/DATA TRANSAKCJI:\s*(\d{4}-\d{2}-\d{2})/i);
    const embeddedDate = dataTransakcjiMatch ? dataTransakcjiMatch[1] : null;
    const finalDate = (embeddedDate && embeddedDate !== dateOp) ? embeddedDate : dateOp;

    const cleanTitle = title
      .replace(/^["']+|["']+$/g,"")
      .replace(/DATA TRANSAKCJI:\s*\d{4}-\d{2}-\d{2}/gi, "")
      .replace(/\s+/g, " ")
      .trim();
    const desc = cleanTitle || opType;
    const cleanSender = (senderRecipient||"").replace(/^["']+|["']+$/g,"").replace(/\s+/g," ").trim();
    const cleanAccount = (account||"").replace(/^['"]+|['"]+$/g,"").trim();
    rows.push({
      date: finalDate, description: desc, opType, amount,
      title: cleanTitle, senderRecipient: cleanSender, account: cleanAccount,
    });
  }
  return rows;
}

function autoCategory(desc, opType) {
  const op = opType.toUpperCase();
  if (op === "PRZELEW NA TWOJE CELE") return "Oszczędności";
  const d = (desc + " " + opType).toLowerCase();
  if (/biedronka|lidl|zabka|żabka|carrefour|rossmann|spar|kaufland|rybny|sklep|piekarnia|warzywniak|raj warzyw|somianka|nguyen|restau|asami|break and lunch|goraco polecam|kfc|mcdonalds|uber.*eat|epoka lodow|putka|akademia kolacz|kornflower/.test(d)) return "Jedzenie";
  if (/spotify|netflix|bookbeat|tvn|skyshow|helios|going|cinema|zalando|temu|empik|lodowato/.test(d)) return "Rozrywka";
  if (/pkp|koleo|bilet|intercity|wizz|airbnb|booking|hotel|parking|nextpark|orlen|stacja paliw|moya|paliw|uber.*trip/.test(d)) return "Transport";
  if (/apteka|lekarz|seroka|szeligow|cefarm|cosmedica|hebe|weteryn|furmanczyk|magiczna/.test(d)) return "Zdrowie";
  if (/prąd|gaz|śmieci|smiec|energia|pge|pgnig|szambo|wywóz|podatek od nieruch|czynsz|czesne|wyżyw|przedszkole|hipoterapia|ubezpieczenie|ergo hestia|iphone rata/.test(d)) return "Rachunki";
  if (/ccc|notino|zara|pepco|komfort|ikea|leroy|ceramiq|decathlon|tantis|industerno|mrowka|market psb/.test(d)) return "Ubrania";
  return "Inne";
}

function parseStatement(text, categoryRules, subcategoryRules, ownerRules, defaultOwner) {
  const rawRows = parseMbankCSV(text);
  if (rawRows.length === 0) return [];
  const filtered = rawRows.filter(r => {
    const op = normalizePolishMojibake(r.opType.toUpperCase()).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    // Keep round-up transfers to savings — these represent real money moving into savings
    if (op === "PRZELEW NA TWOJE CELE") return true;
    // Drop ALL internal transfers between the user's own accounts, both directions:
    // "PRZELEW WŁASNY" and "PRZELEW WEWNĘTRZNY PRZYCHODZĄCY/WYCHODZĄCY" are just money moving
    // between accounts the user owns — not real income or expense.
    if (op.includes("WLASNY") || op.includes("WEWNETRZNY")) return false;
    return true;
  });
  return filtered.map(r => {
    const isRoundup = r.opType.toUpperCase() === "PRZELEW NA TWOJE CELE";
    const description = isRoundup ? "Końcówki z zakupów" : r.description;
    const key = description.trim().toLowerCase();
    return {
      date: r.date, description, amount: r.amount,
      category: categoryRules[key] || autoCategory(r.description, r.opType),
      subcategory: (subcategoryRules && subcategoryRules[key]) || undefined,
      owner: (ownerRules && ownerRules[key]) || defaultOwner,
      opType: r.opType,
      title: r.title || "",
      senderRecipient: r.senderRecipient || "",
      account: r.account || "",
    };
  });
}

async function getAIAdvice(transactions, savings, investments) {
  const summary = transactions.filter(t => t.amount < 0)
    .reduce((acc, t) => { acc[t.category] = (acc[t.category]||0) + Math.abs(t.amount); return acc; }, {});
  const income   = transactions.filter(t => t.amount > 0).reduce((s,t) => s+t.amount, 0);
  const expenses = transactions.filter(t => t.amount < 0).reduce((s,t) => s+Math.abs(t.amount), 0);
  const prompt = `Przychody: ${income.toFixed(0)} PLN, Wydatki: ${expenses.toFixed(0)} PLN, Oszczędności: ${savings} PLN, Inwestycje: ${investments} PLN.\nWydatki wg kategorii: ${JSON.stringify(summary)}.\nDaj 3 konkretne, krótkie porady finansowe po polsku. Każda porada w nowej linii zaczyna się od "•".`;
  return callClaude(prompt, "Jesteś zwięzłym doradcą finansowym. Odpowiadaj po polsku, konkretnie.");
}

// ─── PIN lock screen ──────────────────────────────────────────────────────────
function PinLockScreen({ onUnlock, embeddedPayload }) {
  const hasPin = !!getPinRecord();
  const hasEmbedded = !!embeddedPayload;
  // If the file carries embedded encrypted data but this device has no local PIN record yet,
  // we still must ask for the PIN that was used to encrypt it (we can't verify it via hash —
  // decryption itself is the verification).
  const [mode, setMode] = useState(hasPin || hasEmbedded ? "unlock" : "setup"); // "setup" | "confirm" | "unlock"
  const [pin, setPin] = useState("");
  const [firstPin, setFirstPin] = useState("");
  const [error, setError] = useState("");
  const [lockedUntil, setLockedUntil] = useState(() => getLockout().lockedUntil || 0);
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    if (lockedUntil <= Date.now()) return;
    const t = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(t);
  }, [lockedUntil]);

  const isLocked = lockedUntil > now;
  const secondsLeft = Math.max(0, Math.ceil((lockedUntil - now) / 1000));

  const pad = ["1","2","3","4","5","6","7","8","9","","0","⌫"];

  const handleDigit = (d) => {
    if (isLocked) return;
    setError("");
    if (d === "⌫") { setPin(p => p.slice(0,-1)); return; }
    if (d === "") return;
    if (pin.length >= 6) return;
    const next = pin + d;
    setPin(next);
    if (next.length >= 4) {
      setTimeout(() => trySubmit(next), 150);
    }
  };

  const trySubmit = async (value) => {
    const v = value ?? pin;
    if (v.length < 4) return;

    if (mode === "setup") {
      setFirstPin(v);
      setPin("");
      setMode("confirm");
      return;
    }

    if (mode === "confirm") {
      if (v !== firstPin) {
        setError("PIN-y nie są zgodne. Spróbuj ponownie.");
        setPin(""); setFirstPin(""); setMode("setup");
        return;
      }
      const hash = await hashPin(v);
      setPinRecord(hash);
      markUnlockedThisSession(v);
      onUnlock(v, null);
      return;
    }

    // mode === "unlock"
    if (hasEmbedded) {
      // The file has encrypted data embedded — the PIN must successfully decrypt it.
      try {
        const decrypted = await decryptWithPin(embeddedPayload, v);
        // Decryption succeeded — also (re)store the PIN hash locally for future quick unlocks
        const hash = await hashPin(v);
        setPinRecord(hash);
        setLockout({ attempts: 0, lockedUntil: 0 });
        markUnlockedThisSession(v);
        onUnlock(v, decrypted);
        return;
      } catch {
        registerFailedAttempt();
        return;
      }
    }

    // No embedded data — verify against locally stored hash as before
    const record = getPinRecord();
    const hash = await hashPin(v);
    if (record && hash === record.hash) {
      setLockout({ attempts: 0, lockedUntil: 0 });
      markUnlockedThisSession(v);
      onUnlock(v, null);
    } else {
      registerFailedAttempt();
    }
  };

  const registerFailedAttempt = () => {
    const lo = getLockout();
    const attempts = (lo.attempts || 0) + 1;
    if (attempts >= 5) {
      const until = Date.now() + 60_000;
      setLockout({ attempts: 0, lockedUntil: until });
      setLockedUntil(until);
      setError("Zbyt wiele nieudanych prób. Spróbuj za 60 sekund.");
    } else {
      setLockout({ attempts, lockedUntil: 0 });
      setError(`Nieprawidłowy PIN (próba ${attempts}/5)`);
    }
    setPin("");
  };

  const handleForgot = () => {
    if (hasEmbedded) {
      alert("Ten plik zawiera dane zaszyfrowane konkretnym PIN-em. Bez znajomości tego PIN-u danych nie można odzyskać — to zamierzona ochrona. Możesz otworzyć plik od nowa i zacząć z pustymi danymi, ale wbudowane dane pozostaną zaszyfrowane.");
      return;
    }
    const ok = confirm("Resetowanie PIN-u usunie WSZYSTKIE zapisane dane aplikacji (transakcje, kategorie, oszczędności). Tej operacji nie można cofnąć. Kontynuować?");
    if (!ok) return;
    clearPinRecord();
    localStorage.removeItem(LS_KEY);
    location.reload();
  };

  const title = mode==="setup" ? "Ustaw PIN" : mode==="confirm" ? "Powtórz PIN" : "Wprowadź PIN";
  const subtitle = mode==="setup"
    ? "Ten PIN będzie chronił dostęp do Twoich danych finansowych na tym urządzeniu."
    : mode==="confirm"
      ? "Wpisz ten sam PIN jeszcze raz, aby potwierdzić."
      : hasEmbedded
        ? "Ten plik zawiera zaszyfrowane dane. Wpisz PIN użyty do ich zaszyfrowania."
        : "Aplikacja jest zablokowana PIN-em.";

  return (
    <div style={{
      minHeight:"100vh", background:C.bg, color:C.text, display:"flex",

      flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24,
      fontFamily:"inherit",
    }}>
      <div style={{ fontSize:36, marginBottom:8 }}>🔒</div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:6 }}>{title}</div>
      <div style={{ fontSize:13, color:C.muted, textAlign:"center", maxWidth:280, marginBottom:24 }}>{subtitle}</div>

      {/* PIN dots */}
      <div style={{ display:"flex", gap:12, marginBottom:20 }}>
        {[0,1,2,3,4,5].map(i => (
          <div key={i} style={{
            width:14, height:14, borderRadius:"50%",
            border:`2px solid ${i < pin.length ? C.accent : C.border}`,
            background: i < pin.length ? C.accent : "transparent",
            opacity: i >= 4 && i >= pin.length && pin.length < 4 ? 0.3 : 1,
            transition:"all .15s",
          }} />
        ))}
      </div>

      {isLocked && (
        <div style={{ color:C.red, fontSize:13, marginBottom:16, textAlign:"center" }}>
          Zablokowane na {secondsLeft}s
        </div>
      )}
      {!isLocked && error && (
        <div style={{ color:C.red, fontSize:13, marginBottom:16, textAlign:"center", maxWidth:280 }}>{error}</div>
      )}

      {/* Numeric pad */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 64px)", gap:12, marginBottom:24 }}>
        {pad.map((d, i) => (
          <button key={i} onClick={() => handleDigit(d)} disabled={isLocked || d===""} style={{
            width:64, height:64, borderRadius:"50%", fontSize: d==="⌫" ? 18 : 20, fontWeight:600,
            border:`1px solid ${C.border}`, background: d==="" ? "transparent" : C.card,
            color: d==="⌫" ? C.muted : C.text, cursor: d==="" ? "default" : "pointer",
            opacity: isLocked && d!=="" ? 0.4 : 1, visibility: d==="" ? "hidden" : "visible",
          }}>{d}</button>
        ))}
      </div>

      {mode==="unlock" && (
        <button onClick={handleForgot} style={{ background:"none", border:"none", color:C.muted, fontSize:12, cursor:"pointer", textDecoration:"underline" }}>
          Nie pamiętam PIN-u
        </button>
      )}
      {mode==="confirm" && (
        <button onClick={() => { setMode("setup"); setPin(""); setFirstPin(""); setError(""); }} style={{ background:"none", border:"none", color:C.muted, fontSize:12, cursor:"pointer", textDecoration:"underline" }}>
          Zacznij od nowa
        </button>
      )}
    </div>
  );
}

// library needed, keeps the app a single self-contained file. `points` is an array of
// { date, balance }, assumed already sorted oldest → newest.
function BalanceLineChart({ points, color, height = 140 }) {
  if (!points || points.length === 0) return null;
  const width = 600; // viewBox width — scales responsively via the SVG's CSS width:100%
  const padX = 10, padY = 14;
  const balances = points.map(p => p.balance);
  const minBal = Math.min(0, ...balances);
  const maxBal = Math.max(...balances, 1);
  const range = maxBal - minBal || 1;

  const stepX = points.length > 1 ? (width - padX*2) / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - (p.balance - minBal) / range) * (height - padY*2),
    ...p,
  }));

  const linePath = coords.map((c,i) => (i===0 ? "M" : "L") + c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");
  const areaPath = linePath
    + ` L${coords[coords.length-1].x.toFixed(1)},${height-padY} L${coords[0].x.toFixed(1)},${height-padY} Z`;

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width:"100%", height, display:"block" }} preserveAspectRatio="none">
      <path d={areaPath} fill={color} opacity="0.12" />
      <path d={linePath} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {coords.map((c,i) => (
        <circle key={i} cx={c.x} cy={c.y} r={i===coords.length-1 ? 4 : 2.5} fill={color} />
      ))}
    </svg>
  );
}

        <div style={{ marginTop:6, padding:10, background:C.surface, borderRadius:8 }}>
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:11, color:C.text, fontWeight:600, marginBottom:6 }}>
              Zakres zmiany {onlyThisTx===null && <span style={{ color:C.red }}>— wybierz</span>}
            </div>
            <div style={{ display:"flex", gap:6 }}>
              <button onClick={() => onSetOnlyThisTx(false)} style={{
                flex:1, padding:"6px 8px", borderRadius:7, fontSize:11, cursor:"pointer", textAlign:"left",
                border:`1.5px solid ${onlyThisTx===false ? C.accent : C.border}`,
                background: onlyThisTx===false ? C.accent+"22" : "transparent",
                color: onlyThisTx===false ? C.accent : C.muted,

              <button onClick={() => onSetOnlyThisTx(true)} style={{
                flex:1, padding:"6px 8px", borderRadius:7, fontSize:11, cursor:"pointer", textAlign:"left",
                border:`1.5px solid ${onlyThisTx===true ? C.accent : C.border}`,
                background: onlyThisTx===true ? C.accent+"22" : "transparent",
                color: onlyThisTx===true ? C.accent : C.muted,
                fontWeight: onlyThisTx===true ? 600 : 400,
              }}>Tylko ta jedna</button>
            </div>
          </div>

          <div style={{
            opacity: onlyThisTx===null ? 0.35 : 1,
            pointerEvents: onlyThisTx===null ? "none" : "auto",
            transition: "opacity .15s",
          }}>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
              {(() => {
                const rows = [];
                let currentRow = [];
                categories.forEach(c => {
                  currentRow.push(c);
                  if (expandedPickerCategory === c.label) {
                    rows.push({ pills: currentRow, expanded: c });
                    currentRow = [];
                  }
                });

                return rows.map((row, i) => (
                  <div key={i}>
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>

                        const cHasSubcats = (c.subcategories||[]).length > 0;
                        const isThisExpanded = expandedPickerCategory === c.label;

                            key={c.label}

                      <div style={{ marginTop:6, marginLeft:4, paddingLeft:8, borderLeft:`2px solid ${row.expanded.color}55` }}>
                        <div style={{ fontSize:10, color:C.muted, marginBottom:5 }}>Podkategoria dla „{row.expanded.label}”</div>
                        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                          <button onClick={() => onlyThisTx!==null && onSetSubcategory(t.id, undefined, onlyThisTx)} style={{
                            padding:"4px 9px", borderRadius:14, fontSize:11, cursor: onlyThisTx===null ? "default" : "pointer",
                            border:`1px solid ${!t.subcategory ? row.expanded.color : C.border}`,
                            background: !t.subcategory ? row.expanded.color+"22" : "transparent",
                            color: !t.subcategory ? row.expanded.color : C.muted,
                          }}>— brak —</button>
                          {row.expanded.subcategories.map(sub => (
                            <button key={sub} onClick={() => onlyThisTx!==null && onSetSubcategory(t.id, sub, onlyThisTx)} style={{
