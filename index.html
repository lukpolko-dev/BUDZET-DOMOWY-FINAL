                    const cat = catFor(p.category);
                    return (
                      <span key={p.id} style={{
                        fontSize:11, padding:"4px 9px", borderRadius:14,
                        background:cat.color+"18", border:`1px solid ${cat.color}44`, color:cat.color,
                      }}>{cat.icon} {p.label} · {fmt(p.amount)}</span>
                    );
                  })}
                </div>
              </Card>
            )}
          </div>
        )}

        {/* ── IMPORT ── */}
        {tab==="import" && (
          <Card style={{ maxWidth:660 }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:6 }}>📄 Wklej wyciąg mBank (CSV)</div>
            <div style={{ color:C.muted, fontSize:13, marginBottom:14 }}>
              W mBanku: <strong style={{ color:C.text }}>Historia → Eksportuj → CSV</strong>. Skopiuj całą zawartość pliku i wklej poniżej. Nowe transakcje dopiszą się do już istniejących — aplikacja automatycznie kategoryzuje je na podstawie Twoich wcześniejszych decyzji i ostrzeże, jeśli wykryje potencjalne duplikaty.
            </div>
            <div style={{ background:C.surface, borderRadius:8, padding:12, marginBottom:14, fontSize:11, color:C.muted, lineHeight:1.7, fontFamily:"monospace" }}>
              <strong style={{ color:C.text }}>Format:</strong> #Data księgowania;#Data operacji;#Opis operacji;#Tytuł;…<br/>
              "2026-01-04;2026-01-04;ZAKUP PRZY UŻYCIU KARTY;"Biedronka";…;-227,83;…"<br/>
              <span style={{ color:C.accent }}>ℹ️ Aplikacja używa daty operacji (drugiej kolumny), nie daty księgowania.</span>
            </div>
            <textarea rows={10} placeholder="Wklej tutaj zawartość pliku CSV z mBanku…"
              value={statementText} onChange={e => setStatementText(e.target.value)}
              style={{ ...inputStyle, resize:"vertical", fontFamily:"monospace", fontSize:12 }} />
            <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:12, flexWrap:"wrap" }}>
              <button onClick={handleParseStatement} disabled={parsing||!statementText.trim()}
                style={{ ...btnStyle(C.accent), opacity:parsing||!statementText.trim()?.5:1 }}>
                {parsing ? "Parsowanie…" : "Importuj wyciąg"}
              </button>
              {parseMsg && <span style={{ fontSize:13, color:parseMsg.startsWith("✓")?C.green:C.red }}>{parseMsg}</span>}
            </div>
          </Card>
        )}

        {/* ── FIX OLD DATES (legacy data) ── */}
        {tab==="import" && importedCount > 0 && (
          <Card style={{ maxWidth:660, marginTop:16, border:`1px solid ${C.yellow}55` }}>
            <div style={{ fontWeight:700, fontSize:14, marginBottom:8, color:C.yellow }}>⚠️ Naprawa dat (jednorazowo)</div>
            <div style={{ color:C.muted, fontSize:13, marginBottom:14, lineHeight:1.6 }}>
              Masz <strong style={{ color:C.text }}>{importedCount}</strong> transakcji zaimportowanych z CSV. Jeśli zostały dodane przed poprawką dat (gdy aplikacja błędnie używała daty księgowania), usuń je i zaimportuj wyciąg ponownie — dane wejściowe (kategorie, reguły) zostaną zachowane.
            </div>
            <button onClick={handleRemoveImported} style={{ ...btnStyle(C.red) }}>
              Usuń {importedCount} zaimportowanych transakcji
            </button>
          </Card>
        )}

        {/* ── REMOVE INTERNAL TRANSFERS (legacy data) ── */}
        {tab==="import" && internalTransferCount > 0 && (
          <Card style={{ maxWidth:660, marginTop:16, border:`1px solid ${C.accent}55` }}>
            <div style={{ fontWeight:700, fontSize:14, marginBottom:8, color:C.accent }}>🔁 Przelewy wewnętrzne w historii</div>
            <div style={{ color:C.muted, fontSize:13, marginBottom:14, lineHeight:1.6 }}>
              Wykryto <strong style={{ color:C.text }}>{internalTransferCount}</strong> przelewów wewnętrznych/własnych (między Twoimi kontami), które trafiły do historii przed wprowadzeniem filtra. Usuń je — to nie są prawdziwe przychody/wydatki i zaburzają statystyki.
            </div>
            <button onClick={handleRemoveInternalTransfers} style={{ ...btnStyle(C.accent) }}>
              Usuń {internalTransferCount} przelewów wewnętrznych
            </button>
          </Card>
        )}

        {/* ── ADD MANUAL ── */}
        {tab==="add" && (
          <Card style={{ maxWidth:500 }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:16 }}>➕ Dodaj transakcję ręcznie</div>
            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <Pill active={form.type==="expense"} onClick={() => setForm({...form,type:"expense"})} color={C.red}>Wydatek</Pill>
              <Pill active={form.type==="income"}  onClick={() => setForm({...form,type:"income"})}  color={C.green}>Przychód</Pill>
            </div>
            {[
              { key:"date",        label:"Data",       type:"date"   },
              { key:"description", label:"Opis",       type:"text",   placeholder:"np. Lidl zakupy" },
              { key:"amount",      label:"Kwota (PLN)", type:"number", placeholder:"0.00" },
            ].map(({ key, label, type, placeholder }) => (
              <div key={key} style={{ marginBottom:10 }}>
                <div style={{ fontSize:12, color:C.muted, marginBottom:4 }}>{label}</div>
                <input type={type} placeholder={placeholder} value={form[key]}
                  onChange={e => setForm({...form,[key]:e.target.value})} style={inputStyle} />
              </div>
            ))}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:12, color:C.muted, marginBottom:6 }}>Kategoria</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {categories.map(c => (
                  <Pill key={c.label} active={form.category===c.label} color={c.color}
                    onClick={() => setForm({...form,category:c.label,subcategory:""})}>{c.icon} {c.label}</Pill>
                ))}
              </div>
            </div>
            {(catFor(form.category).subcategories||[]).length > 0 && (
              <div style={{ marginBottom:16 }}>
                <div style={{ fontSize:12, color:C.muted, marginBottom:6 }}>Podkategoria (opcjonalnie)</div>
                <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                  <Pill active={!form.subcategory} color={catFor(form.category).color}
                    onClick={() => setForm({...form,subcategory:""})}>— brak —</Pill>
                  {catFor(form.category).subcategories.map(sub => (
                    <Pill key={sub} active={form.subcategory===sub} color={catFor(form.category).color}
                      onClick={() => setForm({...form,subcategory:sub})}>{sub}</Pill>
                  ))}
                </div>
              </div>
            )}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:12, color:C.muted, marginBottom:6 }}>Kto</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {owners.map(o => (
                  <Pill key={o} active={(form.owner || owners[0])===o} color={C.green}
                    onClick={() => setForm({...form,owner:o})}>👤 {o}</Pill>
                ))}
              </div>
            </div>
            <button onClick={handleAddManual} style={{ ...btnStyle(C.accent), width:"100%" }}>Dodaj transakcję</button>
          </Card>
        )}

        {/* ── TRANSACTIONS ── */}
        {tab==="transactions" && (
          <div>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:12 }}>📋 Historia transakcji</div>

            {/* Search + category filter */}
            <div style={{ marginBottom:12 }}>
              <input
                value={txSearch}
                onChange={e => setTxSearch(e.target.value)}
                placeholder="🔍 Szukaj po opisie, tytule, nadawcy…"
                style={{ ...inputStyle, marginBottom:8 }}
              />
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                <Pill active={txCategoryFilter==="all"} color={C.accent} onClick={() => setTxCategoryFilter("all")}>Wszystkie</Pill>
                {categories.map(c => (
                  <Pill key={c.label} active={txCategoryFilter===c.label} color={c.color} onClick={() => setTxCategoryFilter(c.label)}>
                    {c.icon} {c.label}
                  </Pill>
                ))}
              </div>
            </div>

            {autoApplyMsg && (
              <div style={{ background:C.accent+"22", border:`1px solid ${C.accent}`, borderRadius:10, padding:"10px 14px", marginBottom:12, fontSize:13, color:C.accent }}>
                ✓ Automatycznie przypisano <strong>{autoApplyMsg.count}</strong> podobnych transakcji → <strong>{autoApplyMsg.category}</strong>
              </div>
            )}
            {(() => {
              const q = txSearch.trim().toLowerCase();
              const visibleTx = [...filteredTx]
                .filter(t => txCategoryFilter==="all" || t.category===txCategoryFilter || t.id===editingCategoryId)
                .filter(t => {
                  if (!q) return true;
                  const haystack = [t.description, t.title, t.senderRecipient, t.subcategory]
                    .filter(Boolean).join(" ").toLowerCase();
                  return haystack.includes(q) || t.id===editingCategoryId;
                })
                .sort((a,b) => b.date.localeCompare(a.date));

              if (visibleTx.length === 0) {
                return (
                  <div style={{ color:C.muted, textAlign:"center", paddingTop:40 }}>
                    {q || txCategoryFilter!=="all" ? "Brak transakcji spełniających kryteria" : "Brak transakcji"}
                  </div>
                );
              }

              return <>
                {(q || txCategoryFilter!=="all") && (
                  <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>
                    Znaleziono {visibleTx.length} {visibleTx.length===1 ? "transakcję" : "transakcji"}
                  </div>
                )}
                {visibleTx.map(t => {
              const cat = catFor(t.category);
              const isEditing = editingCategoryId===t.id;
              const isExpanded = expandedTxId===t.id;
              const hasDetails = t.senderRecipient || t.account || t.opType || (t.title && t.title !== t.description);
              const catHasSubcats = (cat.subcategories || []).length > 0;
              return (
                <div key={t.id} style={{ background:C.card, borderRadius:12, marginBottom:8, border:`1px solid ${isEditing?C.accent:C.border}`, overflow:"hidden" }}>
                  <div
                    onClick={() => hasDetails && setExpandedTxId(isExpanded ? null : t.id)}
                    style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"12px 12px 10px", cursor: hasDetails ? "pointer" : "default" }}
                  >
                    <div style={{ fontSize:18, width:36, height:36, borderRadius:9, background:cat.color+"22", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{cat.icon}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:500, fontSize:13, lineHeight:1.3, wordBreak:"break-word", marginBottom:4 }}>
                        {t.description}{hasDetails && <span style={{ color:C.muted, fontSize:11 }}> {isExpanded?"▲":"▼"}</span>}
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                        <span style={{ fontSize:11, color:C.muted }}>{t.date}</span>
                        {ownerFilter==="all" && (
                          <span style={{ fontSize:10, color:C.green, background:C.green+"18", padding:"1px 6px", borderRadius:10 }}>
                            👤 {t.owner || owners[0]}
                          </span>
                        )}
                        <button onClick={(e) => { e.stopPropagation(); setEditingCategoryId(isEditing?null:t.id); setOnlyThisTransaction(null); setExpandedPickerCategory(null); }} style={{
                          background: isEditing ? cat.color+"33" : cat.color+"18",
                          border:`1px solid ${cat.color}55`, borderRadius:20, color:cat.color,
                          padding:"2px 8px", fontSize:11, cursor:"pointer", fontWeight:600,
                        }}>{cat.icon} {t.category}{t.subcategory ? ` · ${t.subcategory}` : ""} ✎</button>
                      </div>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6, flexShrink:0 }}>
                      <div style={{ fontWeight:700, color:t.amount>=0?C.green:C.red, fontSize:14, whiteSpace:"nowrap" }}>
                        {t.amount>=0?"+":""}{fmt(t.amount)}
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); handleDeleteTransaction(t.id); }}
                        style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:14, padding:0 }}>✕</button>
                    </div>
                  </div>
                  {isExpanded && hasDetails && (
                    <div style={{ padding:"10px 14px 14px", borderTop:`1px solid ${C.border}`, background:C.surface, fontSize:12 }}>
                      {t.opType && (
                        <div style={{ marginBottom:8 }}>
                          <div style={{ color:C.muted, marginBottom:2 }}>Typ operacji (z wyciągu)</div>
                          <div style={{ wordBreak:"break-word", fontFamily:"monospace", fontSize:11 }}>{t.opType}</div>
                        </div>
                      )}
                      {t.title && t.title !== t.description && (
                        <div style={{ marginBottom:8 }}>
                          <div style={{ color:C.muted, marginBottom:2 }}>Tytuł przelewu</div>
                          <div style={{ wordBreak:"break-word" }}>{t.title}</div>
                        </div>
                      )}
                      {t.senderRecipient && (
                        <div style={{ marginBottom:8 }}>
                          <div style={{ color:C.muted, marginBottom:2 }}>{t.amount>=0 ? "Nadawca" : "Odbiorca"}</div>
                          <div style={{ wordBreak:"break-word" }}>{t.senderRecipient}</div>
                        </div>
                      )}
                      {t.account && (
                        <div>
                          <div style={{ color:C.muted, marginBottom:2 }}>Numer konta</div>
                          <div style={{ fontFamily:"monospace", wordBreak:"break-all" }}>{t.account}</div>
                        </div>
                      )}
                      {!t.opType && (
                        <div style={{ color:C.muted, fontStyle:"italic" }}>Brak zapisanego typu operacji (transakcja dodana ręcznie lub zaimportowana przed tą wersją aplikacji)</div>
                      )}
                    </div>
                  )}
                  {isEditing && (
                    <div style={{ padding:"8px 12px 12px", borderTop:`1px solid ${C.border}`, background:C.surface }}>
                      <div style={{ marginBottom:12 }}>
                        <div style={{ fontSize:12, color:C.text, fontWeight:600, marginBottom:7 }}>
                          Zakres zmiany {onlyThisTransaction===null && <span style={{ color:C.red }}>— wybierz, aby kontynuować</span>}
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button onClick={() => setOnlyThisTransaction(false)} style={{
                            flex:1, padding:"8px 10px", borderRadius:8, fontSize:12, cursor:"pointer", textAlign:"left",
                            border:`1.5px solid ${onlyThisTransaction===false ? C.accent : C.border}`,
                            background: onlyThisTransaction===false ? C.accent+"22" : "transparent",
                            color: onlyThisTransaction===false ? C.accent : C.muted,
                            fontWeight: onlyThisTransaction===false ? 600 : 400,
                          }}>
                            <div>Wszystkie podobne</div>
                            <div style={{ fontSize:10, opacity:.8, marginTop:2 }}>transakcje o tym samym opisie</div>
                          </button>
                          <button onClick={() => setOnlyThisTransaction(true)} style={{
                            flex:1, padding:"8px 10px", borderRadius:8, fontSize:12, cursor:"pointer", textAlign:"left",
                            border:`1.5px solid ${onlyThisTransaction===true ? C.accent : C.border}`,
                            background: onlyThisTransaction===true ? C.accent+"22" : "transparent",
                            color: onlyThisTransaction===true ? C.accent : C.muted,
                            fontWeight: onlyThisTransaction===true ? 600 : 400,
                          }}>
                            <div>Tylko ta jedna</div>
                            <div style={{ fontSize:10, opacity:.8, marginTop:2 }}>wyłącznie ta transakcja</div>
                          </button>
                        </div>
                      </div>

                      <div style={{
                        opacity: onlyThisTransaction===null ? 0.35 : 1,
                        pointerEvents: onlyThisTransaction===null ? "none" : "auto",
                        transition: "opacity .15s",
                      }}>
                        <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:10 }}>
                          {(() => {
                            // Group categories into rows so each category's subcategory panel can be
                            // inserted immediately after the row it sits in — this is what makes the
                            // subcategory choices appear right under the category just clicked, instead
                            // of in one fixed block at the end driven by the transaction's OLD category.
                            const rows = [];
                            let currentRow = [];
                            categories.forEach(c => {
                              currentRow.push(c);
                              const isThisExpanded = expandedPickerCategory === c.label;
                              if (isThisExpanded) {
                                rows.push({ pills: currentRow, expanded: c });
                                currentRow = [];
                              }
                            });
                            if (currentRow.length > 0) rows.push({ pills: currentRow, expanded: null });
                            return rows.map((row, i) => (
                              <div key={i}>
                                <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                                  {row.pills.map(c => {
                                    const cHasSubcats = (c.subcategories||[]).length > 0;
                                    const isThisExpanded = expandedPickerCategory === c.label;
                                    return (
                                      <button
                                        key={c.label}
                                        onClick={() => {
                                          if (onlyThisTransaction===null) return;
                                          if (cHasSubcats) {
                                            // First click on a category WITH subcategories just opens its
                                            // subcategory panel right below — doesn't change category yet,
                                            // so the user can see and pick a subcategory in the same motion.
                                            setExpandedPickerCategory(isThisExpanded ? null : c.label);
                                            if (!isThisExpanded) handleUpdateCategory(t.id, c.label, onlyThisTransaction);
                                          } else {
                                            handleUpdateCategory(t.id, c.label, onlyThisTransaction);
                                            setExpandedPickerCategory(null);
                                          }
                                        }}
                                        style={{
                                          padding:"5px 10px", borderRadius:16, fontSize:12, cursor: onlyThisTransaction===null ? "default" : "pointer",
                                          border:`1px solid ${isThisExpanded ? c.color : (t.category===c.label?c.color:C.border)}`,
                                          background: isThisExpanded ? c.color+"33" : (t.category===c.label ? c.color+"22" : "transparent"),
                                          color: (isThisExpanded || t.category===c.label) ? c.color : C.muted,
                                          fontWeight: (isThisExpanded || t.category===c.label) ? 600 : 400,
                                        }}
                                      >{c.icon} {c.label}{cHasSubcats ? ` ${isThisExpanded ? "▲" : "▼"}` : ""}</button>
                                    );
                                  })}
                                </div>
                                {row.expanded && (
                                  <div style={{ marginTop:8, marginLeft:4, paddingLeft:10, borderLeft:`2px solid ${row.expanded.color}55` }}>
                                    <div style={{ fontSize:11, color:C.muted, marginBottom:6 }}>Podkategoria dla „{row.expanded.label}” (opcjonalnie)</div>
                                    <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                                      <button onClick={() => onlyThisTransaction!==null && handleSetSubcategory(t.id, undefined, onlyThisTransaction)} style={{
                                        padding:"5px 10px", borderRadius:16, fontSize:12, cursor: onlyThisTransaction===null ? "default" : "pointer",
                                        border:`1px solid ${!t.subcategory ? row.expanded.color : C.border}`,
                                        background: !t.subcategory ? row.expanded.color+"22" : "transparent",
                                        color: !t.subcategory ? row.expanded.color : C.muted,
                                      }}>— brak —</button>
                                      {row.expanded.subcategories.map(sub => (
                                        <button key={sub} onClick={() => onlyThisTransaction!==null && handleSetSubcategory(t.id, sub, onlyThisTransaction)} style={{
                                          padding:"5px 10px", borderRadius:16, fontSize:12, cursor: onlyThisTransaction===null ? "default" : "pointer",
                                          border:`1px solid ${t.subcategory===sub ? row.expanded.color : C.border}`,
                                          background: t.subcategory===sub ? row.expanded.color+"22" : "transparent",
                                          color: t.subcategory===sub ? row.expanded.color : C.muted,
                                          fontWeight: t.subcategory===sub ? 600 : 400,
                                        }}>{sub}</button>
                                      ))}
                                    </div>
                                  </div>
                                )}
                              </div>
                            ));
                          })()}
                        </div>
                        <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10, marginBottom:10 }}>
                          <div style={{ fontSize:11, color:C.muted, marginBottom:6 }}>Kto</div>
                          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                            {owners.map(o => {
                              const isActive = (t.owner || owners[0]) === o;
                              return (
                                <button key={o} onClick={() => onlyThisTransaction!==null && handleSetOwner(t.id, o, onlyThisTransaction)} style={{
                                  padding:"5px 10px", borderRadius:16, fontSize:12, cursor: onlyThisTransaction===null ? "default" : "pointer",
                                  border:`1px solid ${isActive ? C.green : C.border}`,
                                  background: isActive ? C.green+"22" : "transparent",
                                  color: isActive ? C.green : C.muted,
                                  fontWeight: isActive ? 600 : 400,
                                }}>👤 {o}</button>
                              );
                            })}
                          </div>
                        </div>
                      </div>

                      <button onClick={() => { setEditingCategoryId(null); setExpandedPickerCategory(null); }} style={{
                        ...btnStyle(C.accent), width:"100%", padding:"7px",
                      }}>Gotowe</button>
                    </div>
                  )}
                </div>
              );
                })}
              </>;
            })()}
          </div>
        )}

        {/* ── SAVINGS ── */}
        {tab==="savings" && (
          <div style={{ maxWidth:760 }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:6 }}>🏦 Oszczędności & Inwestycje</div>
            <div style={{ color:C.muted, fontSize:13, marginBottom:16, lineHeight:1.5 }}>
              Dodaj konta i połącz je z kategoriami wydatków — saldo automatycznie powiększy się o nowe transakcje z historii. Możesz też w każdej chwili poprawić wartość ręcznie.
            </div>

            {/* Top summary */}
            <div style={{ display:"flex", gap:14, flexWrap:"wrap", marginBottom:20 }}>
              <Card style={{ flex:1, minWidth:240 }}>
                <div style={{ fontWeight:700, fontSize:15, marginBottom:10 }}>🏦 Oszczędności łącznie</div>
                <div style={{ fontSize:26, fontWeight:800, color:C.green, marginBottom:10 }}>{fmt(combinedSavings)}</div>
                <div style={{ fontSize:11, color:C.muted, marginBottom:4 }}>Wartość ogólna (poza kontami, edytuj ręcznie)</div>
                <input type="number" value={savings} onChange={e => setSavings(+e.target.value)} style={inputStyle} />
                {savingsAccounts.length > 0 && (
                  <div style={{ fontSize:11, color:C.muted, marginTop:8 }}>+ {fmt(totalSavingsFromAccounts)} z {savingsAccounts.length} kont poniżej</div>
                )}
              </Card>
              <Card style={{ flex:1, minWidth:240 }}>
                <div style={{ fontWeight:700, fontSize:15, marginBottom:10 }}>📈 Inwestycje łącznie</div>

          <div onClick={e => e.stopPropagation()} style={{

          padding:20, zIndex:1000,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:C.card, borderRadius:16, padding:22, maxWidth:380, width:"100%",
            border:`1px solid ${C.border}`,
          }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:10 }}>Usunąć kategorię „{pendingDeleteCategory}”?</div>
            <div style={{ background:C.surface, borderRadius:10, padding:"12px 14px", marginBottom:16, fontSize:13, color:C.text }}>
              <strong>{transactions.filter(t=>t.category===pendingDeleteCategory).length}</strong> transakcji przypisanych do tej kategorii zostanie przeniesionych do kategorii <strong>„Inne"</strong>.
              <br/><br/>
              Tej operacji nie można cofnąć. Jeśli chcesz tylko zmienić nazwę kategorii bez przenoszenia transakcji, dotknij nazwy kategorii zamiast usuwać.
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={cancelDeleteCategory} style={{
                flex:1, padding:"10px", borderRadius:8, border:`1px solid ${C.border}`,
                background:"transparent", color:C.muted, fontSize:14, cursor:"pointer",
              }}>Anuluj</button>
              <button onClick={confirmDeleteCategory} style={{
                flex:1, padding:"10px", borderRadius:8, border:"none",
                background:C.red, color:"#fff", fontWeight:600, fontSize:14, cursor:"pointer",
              }}>Usuń</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Disable PIN confirmation modal ── */}
      {showDisablePinModal && (
        <div onClick={() => setShowDisablePinModal(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.6)",
          display:"flex", alignItems:"center", justifyContent:"center",
          padding:20, zIndex:1000,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:C.card, borderRadius:16, padding:22, maxWidth:380, width:"100%",
            border:`1px solid ${C.border}`,
          }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:10 }}>Wyłączyć blokadę PIN-em?</div>
            <div style={{ background:C.surface, borderRadius:10, padding:"12px 14px", marginBottom:16, fontSize:13, color:C.text }}>
              Aplikacja będzie otwierać się bez żadnego zabezpieczenia. Każdy z dostępem do tego urządzenia zobaczy Twoje dane finansowe.
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={() => setShowDisablePinModal(false)} style={{
                flex:1, padding:"10px", borderRadius:8, border:`1px solid ${C.border}`,
                background:"transparent", color:C.muted, fontSize:14, cursor:"pointer",
              }}>Anuluj</button>
              <button onClick={handleDisablePin} style={{
                flex:1, padding:"10px", borderRadius:8, border:"none",
                background:C.red, color:"#fff", fontWeight:600, fontSize:14, cursor:"pointer",
              }}>Wyłącz</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── App wrapper: PIN gate ────────────────────────────────────────────────────
function App() {
  const [cryptoMissing] = useState(() => !hasCrypto());
  const embeddedPayload = useState(() => hasCrypto() ? readEmbeddedPayload() : null)[0];
  // If embedded data exists, we cannot trust sessionStorage unlock from a *different* file/session —
  // but within the same browser tab session it's fine to skip re-asking.
  const [unlocked, setUnlocked] = useState(() => !embeddedPayload && isUnlockedThisSession());
  const [sessionPin, setSessionPin] = useState(() => (!embeddedPayload && isUnlockedThisSession()) ? getRememberedSessionPin() : null);
  const [importedData, setImportedData] = useState(null);

  const handleUnlock = (pin, decryptedData) => {
    setSessionPin(pin);
    if (decryptedData) setImportedData(decryptedData);
    setUnlocked(true);
  };

  // Web Crypto API is unavailable in this browser/context — PIN hashing and encrypted export
  // cannot work. Rather than silently hang, explain this and let the user continue without
  // the PIN gate (their data still only lives in localStorage, just without the lock screen).
  if (cryptoMissing) {
    return (
      <div style={{ minHeight:"100vh", background:C.bg, color:C.text, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, fontFamily:"inherit" }}>
        <div style={{ fontSize:36, marginBottom:12 }}>⚠️</div>
        <div style={{ fontSize:17, fontWeight:700, marginBottom:10, textAlign:"center" }}>Blokada PIN niedostępna w tej przeglądarce</div>
        <div style={{ fontSize:13, color:C.muted, textAlign:"center", maxWidth:320, marginBottom:20, lineHeight:1.6 }}>
          Ta przeglądarka lub kontekst (np. podgląd plików, starsza wersja WebView) nie udostępnia Web Crypto API, wymaganego do bezpiecznego haszowania PIN-u i szyfrowania eksportu.
          <br/><br/>
          Spróbuj otworzyć ten plik w aktualnej wersji Chrome, Safari lub Firefox. Możesz też kontynuować bez blokady PIN-em — dane będą nadal zapisywane tylko lokalnie w tej przeglądarce.
        </div>
        <button onClick={() => setUnlocked(true)} style={{ ...btnStyleStatic(C.accent) }}>Kontynuuj bez PIN-u</button>
      </div>
    );
  }

  if (!unlocked) {
    return <PinLockScreen onUnlock={handleUnlock} embeddedPayload={embeddedPayload} />;
  }
  return <BudzetDomowy sessionPin={sessionPin} importedData={importedData} />;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  window.__appLoaded = true;
} catch (err) {
  console.error("Render error:", err);
  document.getElementById("fallback-error").classList.add("show");
  document.getElementById("fallback-error").querySelector("div:nth-child(3)").innerHTML +=
    "<br/><br/><code style='font-size:11px;color:#F87171;word-break:break-all;'>" + err.message + "</code>";
}
</script>
</body>
</html>
